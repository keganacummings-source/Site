<script id="dreamdaw-ui-bridge">
(function(){
  window.__SW_SKIP_DOWNLOAD=true;
  window._DREAM_SAVE_ONLY=true;
  function isSoundSaveControl(el){
    if(!el||el.nodeType!==1)return false;
    var t=((el.textContent||'')+' '+(el.getAttribute('aria-label')||'')+' '+(el.getAttribute('title')||'')).replace(/\s+/g,' ').trim().toLowerCase();
    return /\b(export|save)\b/.test(t) && /\b(wav|audio|sound|sample|tape|session|one[- ]shot|stem|note|4 bar|8 bar)\b/.test(t);
  }
  function scrub(root){(root||document).querySelectorAll('button,a,[role="button"]').forEach(function(el){if(isSoundSaveControl(el))el.remove();});}
  function bindDrop(input){
    if(!input||input.__dreamDropBound)return; input.__dreamDropBound=true;
    var target=input.closest('label,.dropzone,[data-drop],.slot,.sample-slot,.sample-pad,.track,.lane')||input.parentElement||input;
    ['dragenter','dragover'].forEach(function(ev){target.addEventListener(ev,function(e){if(!e.dataTransfer||!e.dataTransfer.files.length)return;e.preventDefault();e.stopPropagation();target.classList.add('sw-drop-active');},{passive:false});});
    ['dragleave','drop'].forEach(function(ev){target.addEventListener(ev,function(e){if(ev==='drop'&&e.dataTransfer&&e.dataTransfer.files.length){e.preventDefault();e.stopPropagation();try{var dt=new DataTransfer();dt.items.add(e.dataTransfer.files[0]);input.files=dt.files;input.dispatchEvent(new Event('change',{bubbles:true}));}catch(_){}}target.classList.remove('sw-drop-active');},{passive:false});});
  }
  function init(){scrub();document.querySelectorAll('input[type=file]').forEach(bindDrop);}
  document.addEventListener('DOMContentLoaded',init);
  (function(){var q=false;new MutationObserver(function(){if(q)return;q=true;requestAnimationFrame(function(){q=false;scrub();document.querySelectorAll('input[type=file]').forEach(bindDrop);});}).observe(document.documentElement,{subtree:true,childList:true});})();
})();

<script id="dreamdaw-clean-runtime">
(function(){
  'use strict';
  function setKnob(input){
    if(!input||input.type!=='range')return;
    var min=parseFloat(input.min), max=parseFloat(input.max), val=parseFloat(input.value);
    if(!isFinite(min))min=0;if(!isFinite(max)||max<=min)max=100;if(!isFinite(val))val=min;
    var p=Math.max(0,Math.min(75,(val-min)/(max-min)*75));
    input.style.setProperty('--knob-p',p.toFixed(2));
    var wrap=input.parentElement&&input.parentElement.classList.contains('knob-wrap')?input.parentElement:null;
    if(wrap){var v=wrap.querySelector('.knob-value');if(v){var nt=String(Math.abs(val)>=100?Math.round(val):Number(val.toFixed(2)));if(v.textContent!==nt)v.textContent=nt;}}
  }
  function enhance(root){
    (root||document).querySelectorAll('input[type=range]').forEach(function(input){
      if(input.dataset.dreamKnob==='1'){setKnob(input);return;}
      input.dataset.dreamKnob='1';
      var parent=input.parentElement;
      if(parent && parent.classList.contains('knob-wrap')){setKnob(input);return;}
      var wrap=document.createElement('span');wrap.className='knob-wrap';
      input.replaceWith(wrap);wrap.appendChild(input);
      var value=document.createElement('span');value.className='knob-value';wrap.appendChild(value);
      input.addEventListener('input',function(){setKnob(input)},{passive:true});
      input.addEventListener('change',function(){setKnob(input)},{passive:true});
      setKnob(input);
    });
  }
  function cleanLearning(){
    document.querySelectorAll('.learn-btn,.learn-dock,#learnBtn,#learnBtnB,#learnDock').forEach(function(el){el.setAttribute('aria-hidden','true');});
  }
  function requestFit(){
    try{
      var r=document.documentElement.getBoundingClientRect();
      var w=Math.max(420,Math.ceil(r.width||document.body.scrollWidth||0));
      var h=Math.max(260,Math.ceil(r.height||document.body.scrollHeight||0));
      if(window.__JUCE__&&window.__JUCE__.backend){
        try{window.__JUCE__.backend.emitEvent('requestResize',{width:w,height:h});}catch(_){ }
        try{window.__JUCE__.backend.emitEvent('setSize',{width:w,height:h});}catch(_){ }
      }
      try{window.parent.postMessage({type:'DREAMDAW_RESIZE',width:w,height:h},'*');}catch(_){ }
    }catch(_){ }
  }

  function fitToHost(){
    try{
      var app=document.querySelector('.app,.machine,.machine-shell'); if(!app) return;
      app.style.zoom='1';
      var aw=document.documentElement.clientWidth||window.innerWidth;
      var ah=document.documentElement.clientHeight||window.innerHeight;
      var sw=Math.max(app.scrollWidth,app.getBoundingClientRect().width);
      var sh=Math.max(app.scrollHeight,app.getBoundingClientRect().height);
      var scale=Math.min(1,(aw-4)/Math.max(1,sw),(ah-4)/Math.max(1,sh));
      if(scale<0.995) app.style.zoom=Math.max(.68,scale.toFixed(3));
      requestFit();
    }catch(_){}
  }

  function init(){enhance();cleanLearning();requestFit();fitToHost();setTimeout(requestFit,80);setTimeout(fitToHost,120);setTimeout(requestFit,300);}
  if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',init);else init();
  (function(){var q=false;new MutationObserver(function(){if(q)return;q=true;requestAnimationFrame(function(){q=false;enhance();cleanLearning();});}).observe(document.documentElement,{subtree:true,childList:true});})();
  window.addEventListener('resize',requestFit,{passive:true});
})();
</script>

<body>
  <h1>DREAMFOG</h1>
  <p class="sub">spectral freeze pad · sample cloud · full-length export</p>
  <div class="app">
    <div class="controls">

    </div>

      <label>MASTER BPM <input type="number" id="masterBpm" min="40" max="240" value="120"></label>

        <select id="exportLen">
          <option value="full" selected>FULL SONG</option>
          <option value="4">4 BARS</option>

          <option value="32">32 BARS</option>
        </select>
      </label>

      <div class="drop" id="drop">Drop a tape — FOG freezes it into a pad cloud</div>
      <div class="hint">Overlapping detuned loops of the same sample. Freeze / drift / width / hiss. Export writes the whole song (or chosen bars), not a 12-second clip. Sample-only.</div>
      <div class="fog-viz" id="fogViz"><div class="bank"></div></div>
      <div class="grid">
        <div class="param"><label>FREEZE <span id="freezeVal">70%</span></label><input id="freeze" type="range" min="0" max="100" value="70"></div>
        <div class="param"><label>DRIFT <span id="driftVal">18%</span></label><input id="drift" type="range" min="0" max="80" value="18"></div>
        <div class="param"><label>WIDTH <span id="widthVal">55%</span></label><input id="width" type="range" min="0" max="100" value="55"></div>
        <div class="param"><label>HISS <span id="hissVal">8%</span></label><input id="hiss" type="range" min="0" max="40" value="8"></div>
        <div class="param"><label>TONE <span id="toneVal">2400 Hz</span></label><input id="tone" type="range" min="400" max="8000" value="2400"></div>
        <div class="param"><label>MIX <span id="mixVal">80%</span></label><input id="mix" type="range" min="0" max="100" value="80"></div>
      </div>
    </div>
    <div class="status" id="status">load a sample to begin</div>
  </div>
<script>
const LEARN_TIPS = {
  playBtn:"Starts the fog cloud of the loaded tape.",
  stopBtn:"Stops every frozen layer.",
  loadBtn:"Load a tape from disk. Full songs are fine.",
  exportBtn:"Renders the whole song (or the bar length you picked) as a WAV and downloads it.",
  saveSamplesBtn:"Parks the rendered fog tape in SESSION without a download.",
  nsBtn:"NightShift — dusk high-pass on the cloud.",
  smBtn:"SleepMode — late-night low-pass.",
  suicideBtn:"Suicide — thicker smear, more layers, heavier hiss.",
  randBtn:"Throws new freeze / drift / width / hiss / tone / mix.",
  exportLen:"FULL SONG follows the loaded tape. Bars follow master BPM.",
  freeze:"How hard the overlapping loops hold the sample in place.",
  drift:"Detune spread between fog layers.",
  width:"Stereo spread of the cloud.",
  hiss:"Soft analog air on the wet path.",
  tone:"Low-pass ceiling of the fog.",
  mix:"Dry song versus frozen cloud."
};

let ac=null, buffer=null, fileName='', playing=false, nodes=null, nightOn=false, sleepOn=false, suicideOn=false;
const p={freeze:70,drift:18,width:55,hiss:8,tone:2400,mix:80};
const DEFAULTS={freeze:70,drift:18,width:55,hiss:8,tone:2400,mix:80};

function setStatus(m){ const s=document.getElementById('status'); if(s) s.textContent=m; }
function ensure(){ if(!ac) ac=new (window.AudioContext||window.webkitAudioContext)(); if(ac.state==='suspended') ac.resume(); return ac; }
function rate(){ return (+document.getElementById('masterBpm').value||120)/(+document.getElementById('sampleBpm').value||120); }

function makeHiss(ctx, seconds, amount){
  const n = Math.max(1, Math.ceil(ctx.sampleRate * Math.max(0.4, seconds)));
  const buf = ctx.createBuffer(2, n, ctx.sampleRate);
  const a = amount / 100;
  for(let c=0;c<2;c++){
    const d=buf.getChannelData(c);
    let pink=0;
    for(let i=0;i<n;i++){
      const white = Math.random()*2-1;
      pink = pink*0.97 + white*0.03;
      d[i] = (white*0.35 + pink*0.65) * a * 0.08;
    }
  }
  const src=ctx.createBufferSource();
  src.buffer=buf; src.loop=true;
  return src;
}

function schedule(ctx, dest, when, playDur){
  if(!buffer) return [];
  const srcs=[];
  const dry=ctx.createGain(); dry.gain.value=1-p.mix/100;
  const wet=ctx.createGain(); wet.gain.value=p.mix/100;
  const lp=ctx.createBiquadFilter(); lp.type='lowpass'; lp.frequency.value=suicideOn ? Math.min(p.tone*0.7, 1600) : p.tone;
  const hp=ctx.createBiquadFilter(); hp.type='highpass'; hp.frequency.value=suicideOn ? 40 : 80;
  const merger=ctx.createGain();
  const layers = suicideOn ? 7 : 5;
  const freezeHold = 0.18 + p.freeze/350;
  for(let i=0;i<layers;i++){
    const src=ctx.createBufferSource(); src.buffer=buffer; src.loop=true;
    const det=((i-(layers-1)/2)/12)*(p.drift/18);
    src.playbackRate.value=Math.max(0.2, rate()*Math.pow(2,det));
    const g=ctx.createGain(); g.gain.value=freezeHold * (suicideOn?1.05:1);
    const pan = ctx.createStereoPanner ? ctx.createStereoPanner() : null;
    if(pan){
      pan.pan.value = ((i%2)?1:-1)*(p.width/100)*0.85 * (i/(layers||1));
      src.connect(g); g.connect(pan); pan.connect(merger);
    } else { src.connect(g); g.connect(merger); }
    const off = (i/layers)*Math.max(0.02, buffer.duration*0.35);
    try{
      if(playDur && playDur>0) src.start(when, off, playDur+0.05);
      else src.start(when, off);
      srcs.push(src);
    }catch(_){}
  }
  const body=ctx.createBufferSource(); body.buffer=buffer; body.loop=true; body.playbackRate.value=rate();
  body.connect(dry);
  try{
    if(playDur && playDur>0) body.start(when, 0, playDur+0.05);
    else body.start(when);
    srcs.push(body);
  }catch(_){}

  if(p.hiss>0){
    const hissSrc=makeHiss(ctx, Math.max(2, playDur||8), p.hiss * (suicideOn?1.8:1));
    const hg=ctx.createGain(); hg.gain.value=1;
    const hlp=ctx.createBiquadFilter(); hlp.type='highpass'; hlp.frequency.value=1800;
    hissSrc.connect(hlp); hlp.connect(hg); hg.connect(wet);
    try{
      if(playDur && playDur>0) hissSrc.start(when, 0, playDur+0.05);
      else hissSrc.start(when);
      srcs.push(hissSrc);
    }catch(_){}
  }

  merger.connect(hp); hp.connect(lp); lp.connect(wet);
  const mast=ctx.createGain(); mast.gain.value=suicideOn?0.62:0.7;
  dry.connect(mast); wet.connect(mast);
  let last=mast;
  if(nightOn){const n=ctx.createBiquadFilter(); n.type='highpass'; n.frequency.value=130; last.connect(n); last=n;}
  if(sleepOn){const n=ctx.createBiquadFilter(); n.type='lowpass'; n.frequency.value=2200; last.connect(n); last=n;}
  if(suicideOn){
    const dly=ctx.createDelay(); dly.delayTime.value=0.086;
    const fb=ctx.createGain(); fb.gain.value=0.28;
    const smear=ctx.createBiquadFilter(); smear.type='lowpass'; smear.frequency.value=1400;
    last.connect(smear); smear.connect(dly); dly.connect(fb); fb.connect(dly); dly.connect(dest);
  }
  last.connect(dest);
  return srcs;
}

function songDurationSec(){
  if(!buffer) return 8;
  const r = rate() || 1;
  // source played at rate r lasts duration/r; looped body covers that whole pass
  return Math.max(1, buffer.duration / r);
}
function exportDurationSec(){
  const mode = document.getElementById('exportLen').value;
  const bpm = +document.getElementById('masterBpm').value || 120;
  const bar = (60/bpm)*4;
  if(mode==='full') return Math.min(600, Math.max(1, songDurationSec()));
  const bars = parseInt(mode,10) || 8;
  return Math.min(600, Math.max(1, bars*bar));
}

function play(){
  if(!buffer){setStatus('load a sample');return;}
  ensure(); stop(); playing=true;
  nodes={srcs:schedule(ac, ac.destination, ac.currentTime, 0)};
  document.getElementById('playBtn').textContent='■ Stop';
  document.getElementById('playBtn').classList.add('playing');
  document.getElementById('fogViz').classList.add('play');
  setStatus('fogging “'+fileName+'” · '+songDurationSec().toFixed(1)+'s song');
}
function stop(){
  playing=false;
  if(nodes&&nodes.srcs) nodes.srcs.forEach(s=>{try{s.stop()}catch(_){}});
  nodes=null;
  document.getElementById('playBtn').textContent='▶ Play';
  document.getElementById('playBtn').classList.remove('playing');
  document.getElementById('fogViz').classList.remove('play');
}
async function loadFile(file){
  ensure();
  try{
    buffer=await ac.decodeAudioData((await file.arrayBuffer()).slice(0));
    fileName=file.name;
    const d=document.getElementById('drop');
    d.textContent=fileName+' · '+buffer.duration.toFixed(1)+'s';
    d.classList.add('has');
    setStatus('loaded “'+fileName+'” — export will write the full '+songDurationSec().toFixed(1)+'s');
    if(playing) play();
  }catch(_){ setStatus('decode failed'); }
}
function bind(){
  [['freeze','freeze',v=>+v,v=>Math.round(v)+'%'],
   ['drift','drift',v=>+v,v=>Math.round(v)+'%'],
   ['width','width',v=>+v,v=>Math.round(v)+'%'],
   ['hiss','hiss',v=>+v,v=>Math.round(v)+'%'],
   ['tone','tone',v=>+v,v=>Math.round(v)+' Hz'],
   ['mix','mix',v=>+v,v=>Math.round(v)+'%']].forEach(([id,k,fr,fmt])=>{
    const el=document.getElementById(id),val=document.getElementById(id+'Val');
    el.addEventListener('input',()=>{ p[k]=fr(parseFloat(el.value)); val.textContent=fmt(p[k]); if(playing) play(); });
    el.addEventListener('dblclick',()=>{ el.value=DEFAULTS[k]; el.dispatchEvent(new Event('input')); });
  });
}

async function exportWAV(){
  if(!buffer){setStatus('empty');return;}
  const dur=exportDurationSec();
  setStatus('rendering '+dur.toFixed(1)+'s fog…');
  const sr=48000;
  const off=new OfflineAudioContext(2, Math.ceil(sr*dur), sr);
  schedule(off, off.destination, 0, dur);
  const rendered=await off.startRendering();
  const blob=new Blob([encodeWAV(rendered)],{type:'audio/wav'});
  const fname=(typeof window.dreamTapeName==='function'?window.dreamTapeName():dreamTapeName())+'.wav';
  if(!window._DREAM_SAVE_ONLY) dreamForceDownload(blob,fname);
  await dreamSaveBlob(blob,fname);
  setStatus('saved “'+fname+'” · '+dur.toFixed(1)+'s');
}
window.exportWAV = exportWAV;

document.getElementById('playBtn').onclick=()=>playing?stop():play();
document.getElementById('stopBtn').onclick=stop;
document.getElementById('loadBtn').onclick=()=>{const i=document.createElement('input');i.type='file';i.accept='audio/*';i.onchange=()=>{if(i.files[0])loadFile(i.files[0]);};i.click();};
document.getElementById('exportBtn').onclick=()=>exportWAV();
document.getElementById('saveSamplesBtn').onclick=async()=>{window._DREAM_SAVE_ONLY=true;window.__SW_SKIP_DOWNLOAD=true;try{await exportWAV();}finally{window._DREAM_SAVE_ONLY=false;window.__SW_SKIP_DOWNLOAD=false;}};
document.getElementById('nsBtn').onclick=function(){nightOn=!nightOn;this.classList.toggle('on',nightOn);if(playing)play();};
document.getElementById('smBtn').onclick=function(){sleepOn=!sleepOn;this.classList.toggle('on',sleepOn);if(playing)play();};
document.getElementById('suicideBtn').onclick=function(){suicideOn=!suicideOn;this.classList.toggle('on',suicideOn);if(playing)play();};
document.getElementById('randBtn').onclick=()=>{['freeze','drift','width','hiss','tone','mix'].forEach(id=>{const el=document.getElementById(id); el.value=+el.min+Math.random()*(+el.max-+el.min); el.dispatchEvent(new Event('input'));});};
['masterBpm','sampleBpm'].forEach(id=>{
  document.getElementById(id).addEventListener('change',()=>{ if(playing) play(); });
});
const drop=document.getElementById('drop');
drop.onclick=()=>document.getElementById('loadBtn').click();
drop.ondragover=e=>{e.preventDefault(); drop.classList.add('over');};
drop.ondragleave=()=>drop.classList.remove('over');
drop.ondrop=e=>{e.preventDefault(); drop.classList.remove('over'); if(e.dataTransfer.files[0]) loadFile(e.dataTransfer.files[0]);};
bind();

document.addEventListener('mousemove', (e)=>{
  if(!window.LEARN_ON) return;
  const t=e.target.closest('[id]');
  if(!t||!LEARN_TIPS[t.id]) return;
  setStatus(LEARN_TIPS[t.id]);
});

function encodeWAV(ab){
  try { if (typeof dreamNormalizeBuffer==='function') ab = dreamNormalizeBuffer(ab, 0.72) || ab; } catch(_){}
  const ch=ab.numberOfChannels,sr=ab.sampleRate,n=ab.length;
  const buf=new ArrayBuffer(44+n*ch*2),v=new DataView(buf);
  const ws=(o,s)=>{for(let i=0;i<s.length;i++)v.setUint8(o+i,s.charCodeAt(i));};
  ws(0,'RIFF');v.setUint32(4,36+n*ch*2,true);ws(8,'WAVE');ws(12,'fmt ');
  v.setUint32(16,16,true);v.setUint16(20,1,true);v.setUint16(22,ch,true);
  v.setUint32(24,sr,true);v.setUint32(28,sr*ch*2,true);v.setUint16(32,ch*2,true);v.setUint16(34,16,true);
  ws(36,'data');v.setUint32(40,n*ch*2,true);
  let o=44;const chs=[];for(let c=0;c<ch;c++)chs.push(ab.getChannelData(c));
  for(let i=0;i<n;i++)for(let c=0;c<ch;c++){let s=Math.max(-1,Math.min(1,chs[c][i]));v.setInt16(o,s<0?s*0x8000:s*0x7fff,true);o+=2;}
  return buf;
}
function dreamTapeName(){const A=['FOGBED','MISTHOLD','FREEZEPAD','GREYCLOUD','SLEEPFOG','DUSKHOLD','VAPOUR'];return A[(Math.random()*A.length)|0];}
function dreamForceDownload(blob,filename){
  if (window.__SW_SKIP_DOWNLOAD || window._DREAM_SAVE_ONLY) return;
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=filename;document.body.appendChild(a);a.click();a.remove();
}
async function dreamSaveBlob(blob, filename) {
  try {
    if (!(window.parent && window.parent !== window)) return false;
    const buffer = await blob.arrayBuffer();
    const bytes = new Uint8Array(buffer);
    const machine = (document.title || '').split(/[—\-·|]/)[0].trim() || 'MACHINE';
    return await new Promise((resolve) => {
      const t = setTimeout(() => resolve(false), 8000);
      function onMsg(e) {
        if (!e.data || e.data.type !== 'DREAM_SAVE_RESULT') return;
        window.removeEventListener('message', onMsg); clearTimeout(t); resolve(!!e.data.ok);
      }
      window.addEventListener('message', onMsg);
      window.parent.postMessage({ type:'DREAM_SAVE', filename: filename, buffer: (bytes.buffer.slice(bytes.byteOffset, bytes.byteOffset + bytes.byteLength)), bytes: new Uint8Array(bytes.buffer.slice(bytes.byteOffset, bytes.byteOffset + bytes.byteLength)), machine: machine, mime:'audio/wav' }, '*');
    });
  } catch(_) { return false; }
}
