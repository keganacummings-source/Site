<!DOCTYPE html>
<html lang="en" data-fx="fireflies">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DREAMDAW</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<style>
:root{--bg:#0e0608;--panel:#1a0c12;--panel-2:#12080c;--accent:#c04068;--accent-dim:#7a2844;--accent-bright:#e07090;--accent2:#a02848;--text:#f4e4ea;--text-dim:#9a7884;--border:#341820;--glow:rgba(192,64,104,.26);--radius:6px}
*{box-sizing:border-box}
html,body{height:100%;margin:0;overflow:hidden;background:var(--bg);color:var(--text);font-family:"Segoe UI",Arial,Helvetica,sans-serif}
#scene,#veil,#fx,#grain{position:fixed;pointer-events:none}
#scene{inset:-12%;animation:drift 38s ease-in-out infinite alternate;z-index:0}
#veil{inset:0;z-index:1}
#fx{inset:0;z-index:2}
#grain{inset:0;z-index:4;opacity:.07;background:repeating-linear-gradient(0deg,#fff 0 1px,transparent 1px 3px);mix-blend-mode:overlay;animation:flick 6s steps(2) infinite}
@keyframes drift{from{transform:translate(-2%,-1%) scale(1)}to{transform:translate(2%,1.5%) scale(1.08)}}
@keyframes flick{50%{opacity:.04}}
#app{position:relative;z-index:3;height:100%;padding:6px}
#frame{height:100%;border:2px solid var(--accent-dim);padding:4px;box-shadow:0 0 30px var(--glow)}
#inner{height:100%;display:flex;flex-direction:column;border:1px solid var(--accent);background:color-mix(in srgb,var(--bg) 78%,transparent);box-shadow:inset 0 0 50px var(--glow);padding:12px 16px 0}
.top{text-align:center;margin-bottom:6px}
.top h1{margin:0;display:inline-flex;align-items:center;gap:14px;font-size:27px;letter-spacing:.06em;color:var(--accent);text-shadow:0 0 18px var(--glow),0 0 2px var(--accent);animation:glow 4s ease-in-out infinite}
@keyframes glow{50%{text-shadow:0 0 30px var(--accent),0 0 2px var(--accent-bright)}}
.eye{width:36px;height:22px;border:2px solid var(--accent);border-radius:50%;position:relative;box-shadow:0 0 10px var(--glow)}
.eye::after{content:"";position:absolute;left:50%;top:50%;width:8px;height:8px;margin:-4px;border-radius:50%;background:var(--accent);animation:look 7s infinite}
@keyframes look{0%,40%{transform:translateX(0)}50%,60%{transform:translateX(7px)}70%,90%{transform:translateX(-7px)}}
.sub{font-size:10px;letter-spacing:.06em;color:var(--text-dim)}
.row{display:flex;align-items:center;gap:8px;margin:7px 0;flex-wrap:wrap;position:relative}
.row.z{z-index:50}
.sp{flex:1}
.mini{font-size:10px;color:var(--text-dim);letter-spacing:.04em}
.mini b{color:var(--text)}
button,input{font:inherit;color:inherit}
.btn{background:transparent;border:1px solid var(--text-dim);border-radius:var(--radius);padding:7px 14px;cursor:pointer;color:var(--text);font-size:13px;transition:.15s}
.btn.a{border-color:var(--accent);color:var(--accent);letter-spacing:.04em}
.btn:hover{border-color:var(--accent-bright);color:var(--accent-bright);box-shadow:0 0 12px var(--glow)}
.btn.on{background:var(--accent-dim);color:#fff;border-color:var(--accent)}
.btn.main{background:var(--accent);border-color:var(--accent);color:#fff}
.tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:7px 0}
.tabs .btn{padding:5px;font-size:12px}
#q{width:100%;background:var(--panel-2);border:1px solid var(--accent-dim);border-radius:3px;padding:6px 10px;outline:none;font-size:13px}
#q:focus,.f input:focus{border-color:var(--accent);box-shadow:0 0 12px var(--glow)}
main{flex:1;overflow-y:auto;padding:10px 8px 14px 0;margin-top:8px}
#grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:9px}
.card{padding:9px 11px 11px;background:color-mix(in srgb,var(--panel) 85%,transparent);border:1px solid var(--accent-dim);border-radius:var(--radius);cursor:pointer;position:relative;overflow:hidden;opacity:0;animation:rise .45s ease forwards;transition:transform .2s,box-shadow .2s,border-color .2s}
.ct{display:flex;align-items:center;justify-content:space-between;gap:8px}
.ct strong{font-size:12px;letter-spacing:.03em}
.fav{font-size:11px;padding:3px 9px;border:1px solid var(--accent);border-radius:12px;color:var(--accent)}
.fav.on{background:var(--accent);color:#fff}
.card small{display:block;margin-top:2px;color:var(--text-dim);font-size:10px}
.trk{height:5px;margin-top:11px;background:#000;border-radius:3px;overflow:hidden}
.trk i{display:block;height:100%;width:28%;background:var(--accent);border-radius:3px;transition:width .5s ease;box-shadow:0 0 8px var(--accent)}
.card:hover{border-color:var(--accent-bright);box-shadow:0 6px 22px var(--glow)}
.card:hover .trk i{width:100%}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1}}
#status{color:var(--text-dim);font-size:13px;padding:10px 0}
[data-fx=embers] .card:hover{transform:translateY(-4px)}
[data-fx=snow] .card{border-bottom-width:2px}
[data-fx=stars] .card::after{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(115deg,transparent 40%,var(--glow),transparent 60%);background-size:250% 100%;animation:sweep 5s linear infinite}
@keyframes sweep{from{background-position:150% 0}to{background-position:-100% 0}}
[data-fx=rain] .card::before{content:"";position:absolute;left:0;right:0;height:2px;background:var(--accent);opacity:.45;box-shadow:0 0 10px var(--accent);animation:scan 3.4s linear infinite}
@keyframes scan{from{top:-4px}to{top:100%}}
[data-fx=fireflies] .card{animation:rise .45s ease forwards,breathe 6s ease-in-out infinite}
@keyframes breathe{50%{box-shadow:0 0 16px var(--glow)}}
#themes{display:none;position:absolute;right:0;top:calc(100% + 6px);width:360px;max-width:92vw;max-height:55vh;overflow-y:auto;padding:10px;background:var(--panel);border:1px solid var(--accent);border-radius:var(--radius);box-shadow:0 20px 60px rgba(0,0,0,.8),0 0 30px var(--glow);grid-template-columns:repeat(2,1fr);gap:8px;z-index:99}
#themes.open{display:grid}
#tw{position:relative}
.chip{display:flex;flex-direction:column;gap:2px;text-align:left;padding:7px 10px 7px 14px;border:1px solid var(--border);border-radius:var(--radius);background:var(--panel-2);cursor:pointer;position:relative;overflow:hidden}
.chip i{position:absolute;left:0;top:0;bottom:0;width:6px}
.chip span{font-size:12px;letter-spacing:.08em}
.chip small{font-size:10px;color:var(--text-dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chip.on,.chip:hover{border-color:var(--accent)}
*{scrollbar-width:thin;scrollbar-color:var(--accent-dim) transparent}
::-webkit-scrollbar{width:10px}
::-webkit-scrollbar-thumb{background:var(--accent-dim);border-radius:10px;border:2px solid transparent;background-clip:padding-box}
::-webkit-scrollbar-thumb:hover{background:var(--accent)}
#gate{position:fixed;inset:0;z-index:30;display:none;align-items:center;justify-content:center;background:color-mix(in srgb,var(--bg) 78%,transparent);backdrop-filter:blur(10px)}
#gate.on{display:flex}
.box{width:min(360px,90vw);padding:26px;background:var(--panel);border:2px solid var(--accent-dim);outline:1px solid var(--accent);outline-offset:-6px;box-shadow:0 0 60px var(--glow);animation:rise .6s ease forwards}
.box h1{margin:0 0 4px;font-size:22px;text-align:center;color:var(--accent);text-shadow:0 0 16px var(--glow)}
.box p{margin:0 0 18px;text-align:center;font-size:11px;color:var(--text-dim)}
.f{display:flex;flex-direction:column;gap:11px}
.f input{background:var(--panel-2);border:1px solid var(--accent-dim);border-radius:4px;padding:10px 12px;outline:none}
#err{min-height:15px;color:var(--accent-bright);font-size:12px;text-align:center}
@media (prefers-reduced-motion:reduce){*{animation:none!important}.card{opacity:1}}
</style>
</head>
<body>
<div id="scene"></div><div id="veil"></div><canvas id="fx"></canvas><div id="grain"></div>
<div id="app"><div id="frame"><div id="inner">
  <div class="top">
    <h1><span class="eye"></span>DREAMDAW<span class="eye"></span></h1>
    <div class="sub">MACHINE SELECTOR / <span id="count">0</span> DISTINCT NAMED MODULES</div>
  </div>
  <div class="row">
    <span class="mini auth" style="display:none">SIGNED IN | <b id="who"></b></span>
    <div class="sp"></div>
    <span class="mini auth" style="display:none"><b>ONLINE: <span id="online">0</span></b></span>
    <button class="btn auth" id="out" type="button" style="display:none">LOG OUT</button>
  </div>
  <div class="row z">
    <button class="btn a" data-f="all" type="button">ALL MACHINES</button>
    <button class="btn a" data-f="stable" type="button">STABLE</button>
    <button class="btn a" data-f="beta" type="button">BETA</button>
    <button class="btn a" data-f="fav" type="button">FAVORITES *</button>
    <div class="sp"></div>
    <button class="btn a" id="site" type="button">DREAMDAW.COM</button>
    <div id="tw"><button class="btn a" id="tbtn" type="button">THEME: -</button><div id="themes"></div></div>
  </div>
  <input id="q" placeholder="Search machines..." autocomplete="off">
  <main><div id="grid"><div id="status">loading machines…</div></div></main>
</div></div></div>

<div id="gate">
  <form class="box f" id="login">
    <h1>DREAMDAW</h1>
    <p>LOG IN TO CONTINUE</p>
    <input id="user" placeholder="username" autocomplete="username">
    <input id="pass" type="password" placeholder="password" autocomplete="current-password">
    <div id="err"></div>
    <button class="btn main" type="submit">LOG IN</button>
  </form>
</div>

<script>
const API="https://dreamshare-api.keganacummings.workers.dev/";
const BASE=new URL(".",location.href).href;
const $=id=>document.getElementById(id), LS=localStorage;
let filt="all",favs=JSON.parse(LS.getItem("dreamdaw.favs")||"[]"),token=LS.getItem("dreamdaw.token")||"", me=LS.getItem("dreamdaw.user")||"", beat=null, packs=[], lib=[];

async function api(body){
  const r=await fetch(API,{method:"POST",headers:{"content-type":"application/json","X-SW-Token":token},body:JSON.stringify(Object.assign({token},body))});
  return r.json();
}
function native(name,payload){try{window.__JUCE__.backend.emitEvent(name,payload||{})}catch(e){}}

/* ---------- auth ---------- */
function gate(on,msg){$("gate").classList.toggle("on",on);$("err").textContent=msg||"";document.querySelectorAll(".auth").forEach(e=>e.style.display=on?"none":"");}
function enter(){
  gate(false);$("who").textContent=me;
  clearInterval(beat);ping();beat=setInterval(ping,25000);
}
async function ping(){
  try{const d=await api({action:"presence"});if(d&&d.online)$("online").textContent=d.online.length;
      if(d&&d.code==="auth")leave("Session expired — log in again");}catch(e){}
}
function leave(msg){
  clearInterval(beat);token=me="";LS.removeItem("dreamdaw.token");LS.removeItem("dreamdaw.user");
  native("setSession",{user:"",token:"",role:""});gate(true,msg);
}
async function boot(){
  if(!token){gate(true);return}
  try{const d=await api({action:"session"});
    if(d&&d.ok!==false&&d.user){me=d.user;LS.setItem("dreamdaw.user",me);enter();}
    else leave();
  }catch(e){gate(true,"Can't reach DreamShare — check your connection")}
}
$("login").onsubmit=async ev=>{
  ev.preventDefault();$("err").textContent="";
  try{
    const r=await fetch(API,{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({action:"login",user:$("user").value.trim(),pass:$("pass").value})});
    const d=await r.json();
    if(!d.ok){$("err").textContent=d.error||"Login failed";return}
    token=d.token;me=d.user;LS.setItem("dreamdaw.token",token);LS.setItem("dreamdaw.user",me);
    $("pass").value="";native("setSession",{user:d.user,token:d.token,role:d.role||"user"});enter();
  }catch(e){$("err").textContent="Can't reach DreamShare"}
};
$("out").onclick=()=>leave();

/* ---------- machines ---------- */
function openMachine(url,name){
  native("openMachine",{url,name});
  setTimeout(()=>{location.href=url},300);
}
function render(){
  const f=$("q").value.trim().toLowerCase(),g=$("grid");g.innerHTML="";
  document.querySelectorAll("[data-f]").forEach(b=>b.classList.toggle("on",b.dataset.f===filt));
  const list=lib.filter(p=>{const n=(p.name||p.title||"");
    return (!f||n.toLowerCase().includes(f))&&(filt==="all"||(filt==="beta"&&p.beta)||(filt==="stable"&&!p.beta)||(filt==="fav"&&favs.includes(n)))});
  $("count").textContent=lib.length;
  if(!list.length){g.innerHTML='<div id="status">no machines found</div>';return}
  list.forEach((p,i)=>{
    const name=p.name||p.title||"unnamed",file=p.fileName||p.file||"";
    const url=BASE+String(p.url||"Pluggins Folder/"+file).replace(/ /g,"%20");
    const b=document.createElement("div");b.className="card";b.tabIndex=0;
    b.style.animationDelay=Math.min(i*25,500)+"ms";
    b.innerHTML='<div class="ct"><strong></strong><span class="fav"></span></div><small></small><div class="trk"><i></i></div>';
    b.querySelector("strong").textContent=name;
    b.querySelector("small").textContent=file+(p.beta?" · beta":"");
    const fv=b.querySelector(".fav"),on=favs.includes(name);fv.textContent=on?"FAV ★":"FAV +";fv.classList.toggle("on",on);
    fv.onclick=e=>{e.stopPropagation();favs=favs.includes(name)?favs.filter(x=>x!==name):favs.concat(name);LS.setItem("dreamdaw.favs",JSON.stringify(favs));render()};
    b.onclick=()=>openMachine(url,name);g.appendChild(b);
  });
}
document.querySelectorAll("[data-f]").forEach(b=>b.onclick=()=>{filt=b.dataset.f;render()});
$("site").onclick=()=>openMachine("https://www.dreamdaw.com/","DREAMDAW.COM");
$("q").oninput=render;
fetch(BASE+"library.json").then(r=>r.json()).then(j=>{lib=j.plugins||j.machines||[];render()})
  .catch(e=>{$("grid").innerHTML='<div id="status">'+String(e)+'</div>'});

/* ---------- themes + motion ---------- */
const FX={embers:"bloodmoon ember amber rust copper sulfur cinder honey sand dawn",
 snow:"ice fog ash bone paper light steel graphite static pine",
 stars:"void dusk ink abyss cobalt violet lilac plum aurora",
 rain:"neon mint lagoon default olive",
 fireflies:"moss wine velvet marrow cherry trippah goonr vsttrippah"};
function fxFor(id){for(const k in FX)if(FX[k].split(" ").includes(id))return k;return"fireflies"}
const cv=$("fx"),cx=cv.getContext("2d");let P=[],mode="fireflies",col="#fff",W=0,H=0,run=false;
function size(){W=cv.width=innerWidth;H=cv.height=innerHeight}
addEventListener("resize",size);size();
function mk(init){const r=Math.random;return{x:r()*W,y:init||mode==="stars"||mode==="fireflies"?r()*H:mode==="embers"?H+10:-10,s:r()*2+1,v:r()*.8+.4,p:r()*6.28}}
function tick(t){
  cx.clearRect(0,0,W,H);cx.fillStyle=cx.strokeStyle=col;
  for(const p of P){
    if(mode==="embers"){p.y-=p.v*1.3;p.x+=Math.sin(t/800+p.p)*.6;cx.globalAlpha=Math.max(0,Math.min(.8,p.y/H*1.6));cx.beginPath();cx.arc(p.x,p.y,p.s,0,6.3);cx.fill();if(p.y<-10)Object.assign(p,mk())}
    else if(mode==="snow"){p.y+=p.v*.7;p.x+=Math.sin(t/1500+p.p)*.4;cx.globalAlpha=.5;cx.beginPath();cx.arc(p.x,p.y,p.s*1.2,0,6.3);cx.fill();if(p.y>H+10)Object.assign(p,mk())}
    else if(mode==="stars"){cx.globalAlpha=.25+.65*Math.abs(Math.sin(t/900+p.p));cx.fillRect(p.x,p.y,p.s,p.s)}
    else if(mode==="rain"){p.y+=p.v*2.2;if(Math.random()<.02)p.c=Math.random()<.5?"0":"1";cx.globalAlpha=.3;cx.font="14px monospace";cx.fillText(p.c||"1",p.x,p.y);if(p.y>H+20)Object.assign(p,mk())}
    else{p.x+=Math.cos(t/2200+p.p)*.35;p.y+=Math.sin(t/1900+p.p)*.35;cx.globalAlpha=.2+.6*Math.abs(Math.sin(t/1300+p.p));cx.shadowBlur=14;cx.shadowColor=col;cx.beginPath();cx.arc(p.x,p.y,p.s*1.6,0,6.3);cx.fill();cx.shadowBlur=0}
  }
  requestAnimationFrame(tick);
}
function setFx(id,accent){
  mode=fxFor(id);col=accent||"#fff";document.documentElement.dataset.fx=mode;
  P=Array.from({length:mode==="rain"?60:mode==="stars"?90:55},()=>mk(true));
  if(!run&&!matchMedia("(prefers-reduced-motion:reduce)").matches){run=true;requestAnimationFrame(tick)}
}
function apply(pk){
  const v=pk.vars||{},s=document.documentElement.style;
  for(const k in v)s.setProperty(k,v[k]);
  $("scene").style.background=pk.scene||"var(--bg)";$("veil").style.background=pk.veil||"none";
  setFx(pk.id,v["--accent-bright"]||v["--accent"]);
  LS.setItem("SLEEPWELL_THEME",pk.id);$("tbtn").textContent="THEME: "+(pk.name||pk.id).toUpperCase();
  document.querySelectorAll(".chip").forEach(c=>c.classList.toggle("on",c.dataset.id===pk.id));
}
async function themes(){
  let files=[];
  try{files=(await (await fetch(BASE+"Themes/themes.json")).json()).themes.map(t=>t.file)}catch(e){}
  const all=await Promise.all(files.map(f=>fetch(BASE+"Themes/"+f).then(r=>r.text()).then(h=>{
    const m=h.match(/<script type="application\/sleepwell-theme">([\s\S]*?)<\/script>/);return m?JSON.parse(m[1]):null}).catch(()=>null)));
  packs=all.filter(Boolean);
  const box=$("themes");
  packs.forEach(pk=>{
    const c=document.createElement("button");c.type="button";c.className="chip";c.dataset.id=pk.id;
    c.innerHTML='<i></i><span></span><small></small>';
    c.firstChild.style.background="linear-gradient(180deg,"+(pk.vars["--accent"]||"#888")+","+(pk.vars["--bg"]||"#000")+")";
    c.children[1].textContent=pk.name||pk.id;c.children[2].textContent=pk.tag||"";
    c.onclick=()=>{apply(pk);if(token)api({action:"set_theme",theme:pk.id}).catch(()=>{})};
    box.appendChild(c);
  });
  const want=LS.getItem("SLEEPWELL_THEME")||"trippah";
  const pk=packs.find(p=>p.id===want)||packs[0];if(pk)apply(pk);else setFx("trippah");
}
$("tbtn").onclick=e=>{e.stopPropagation();$("themes").classList.toggle("open")};
document.addEventListener("click",e=>{if(!$("tw").contains(e.target))$("themes").classList.remove("open")});

setFx("trippah");themes();boot();document.querySelector("[data-f=all]").classList.add("on");
</script>
</body>
</html>
