<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
    <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=VT323&display=swap" rel="stylesheet">
  <title>DREAMDRDRUM</title>
  <script src="../Themes/sleepwell-theme.js"></script>
  <script src="../Themes/sleepwell-suite.js"></script>
  <style>
    :root {
      --bg: #0a0a0a;
      --panel: #111111;
      --accent: #e62020;
      --accent-dim: #a01818;
      --accent-bright: #ff3333;
      --text: #f5f5f5;
      --text-dim: #a0a0a0;
      --kick: #e62020;
      --snare: #ffffff;
      --hat: #c0c0c0;
      --openhat: #e0e0e0;
      --clap: #ff5555;
      --perc: #888888;
      --step-off: #1a1a1a;
      --step-on: var(--accent);
      --border: #2a2a2a;
      --radius: 6px;
      --font: 'Share Tech Mono', 'VT323', ui-monospace, monospace;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: var(--font);
      background: transparent;
      color: var(--text);
      min-height: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: stretch;
      justify-content: flex-start;
      padding: 0;
      position: relative;
      overflow: hidden;
      background-image: none;
      background-color: transparent;
    }

    h1 {
      font-family: VT323, var(--font);
      font-size: 1.75rem;
      font-weight: 400;
      letter-spacing: 0.14em;
      color: var(--accent);
      margin: 0;
      text-align: left;
      text-transform: uppercase;
      text-shadow: 0 0 18px color-mix(in srgb, var(--accent) 40%, transparent);
      line-height: 1;
    }

    .subtitle {
      color: var(--text-dim);
      font-size: 0.68rem;
      margin: 0;
      text-align: left;
      letter-spacing: 0.04em;
      flex: 1 1 auto;
    }

    .app-frame {
      width: 100%;
      height: 100%;
      max-width: none;
      display: flex;
      justify-content: stretch;
      align-items: stretch;
      flex: 1;
      min-height: 0;
    }

    .app {
      width: 100%;
      height: 100%;
      max-width: none;
      max-height: none;
      background: var(--panel);
      border-radius: 0;
      border: 1px solid var(--border);
      box-shadow: none;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      transform: none;
      flex: 1;
      min-height: 0;
    }

    .controls {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      padding: 10px 12px;
      background: linear-gradient(180deg, color-mix(in srgb, var(--panel) 90%, #000) 0%, var(--panel) 100%);
      border-bottom: 1px solid var(--border);
      align-items: center;
      justify-content: flex-start;
      flex-shrink: 0;
    }
    .title-row {
      width: 100%;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 10px;
      margin-bottom: 4px;
    }

    .controls-left, .controls-right {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      align-items: center;
    }

    button {
      font-family: var(--font);
      font-size: 0.75rem;
      font-weight: 600;
      padding: 6px 11px;
      border: none;
      border-radius: var(--radius);
      cursor: pointer;
      transition: all 0.15s ease;
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }

    button:active {
      transform: scale(0.97);
    }

    .btn-primary {
      background: var(--accent);
      color: #fff;
    }
    .btn-primary:hover { background: var(--accent-bright); }

    .btn-secondary {
      background: #1a1a1a;
      color: var(--text);
      border: 1px solid var(--border);
    }
    .btn-secondary:hover { background: #252525; }

    .btn-danger {
      background: #3a1515;
      color: #ffaaaa;
      border: 1px solid #5a2020;
    }
    .btn-danger:hover { background: #4a1a1a; }

    .btn-play {
      background: #1a1a1a;
      color: #fff;
      border: 1px solid var(--border);
      min-width: 72px;
    }
    .btn-play:hover { background: #252525; border-color: #444; }
    .btn-play.playing {
      background: var(--accent);
      border-color: var(--accent-bright);
      color: #fff;
    }

    label.slider-label {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 0.7rem;
      color: var(--text-dim);
    }

    input[type="range"] {
      -webkit-appearance: none;
      width: 72px;
      height: 4px;
      background: #2a2a2a;
      border-radius: 2px;
      outline: none;
    }
    input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 12px;
      height: 12px;
      background: var(--accent);
      border-radius: 50%;
      cursor: pointer;
    }

    .bpm-inline {
      display: flex;
      align-items: center;
      gap: 5px;
      font-size: 0.7rem;
      color: var(--text-dim);
      font-weight: 600;
    }
    .bpm-inline input[type="number"] {
      width: 54px;
      padding: 4px 6px;
      background: #1a1a1a;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      color: var(--accent);
      font-family: var(--font);
      font-size: 0.85rem;
      font-weight: 800;
      text-align: center;
      font-variant-numeric: tabular-nums;
    }
    .bpm-inline input[type="number"]:focus {
      outline: none;
      border-color: var(--accent);
    }

    .mode-toggle {
      display: flex;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      overflow: hidden;
    }
    .mode-toggle button {
      border-radius: 0;
      border: none;
      background: #1a1a1a;
      color: var(--text-dim);
      padding: 5px 9px;
      font-size: 0.65rem;
      font-weight: 600;
      cursor: pointer;
    }
    .mode-toggle button.active {
      background: var(--accent);
      color: #fff;
    }
    .mode-toggle button:not(.active):hover {
      background: #252525;
      color: var(--text);
    }

    .sequencer {
      padding: 8px 10px 12px;
      flex: 1;
      overflow-y: auto;
      min-height: 0;
      background:
        radial-gradient(ellipse 70% 40% at 0% 0%, color-mix(in srgb, var(--accent) 8%, transparent), transparent 55%);
    }

    .track {
      display: grid;
      grid-template-columns: 100px minmax(0, 1fr) 56px;
      gap: 8px;
      align-items: center;
      margin-bottom: 4px;
      padding: 6px 4px;
      border-bottom: 1px solid color-mix(in srgb, var(--border) 80%, transparent);
      border-radius: 6px;
    }
    .track:hover {
      background: color-mix(in srgb, var(--panel) 70%, #000);
    }

    .track:last-child {
      border-bottom: none;
      margin-bottom: 0;
      padding-bottom: 0;
    }

    .track-info {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .track-name {
      font-family: VT323, var(--font);
      font-weight: 400;
      font-size: 1.05rem;
      display: flex;
      align-items: center;
      gap: 6px;
      text-transform: uppercase;
      letter-spacing: 0.06em;
    }

    .track-name .dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      flex-shrink: 0;
    }

    .track-name.kick .dot { background: var(--kick); }
    .track-name.snare .dot { background: var(--snare); }
    .track-name.closedhat .dot { background: var(--hat); }
    .track-name.openhat .dot { background: var(--openhat); }
    .track-name.clap .dot { background: var(--clap); }
    .track-name.perc .dot { background: var(--perc); }

    .sample-btn {
      font-size: 0.68rem;
      padding: 4px 7px;
      background: var(--panel);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 4px;
      cursor: pointer;
      width: fit-content;
      max-width: 96px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .sample-btn:hover { color: var(--text); background: #252525; }
    .sample-btn.has-sample {
      color: var(--accent);
      border-color: var(--accent-dim);
    }

    .track.drag-over {
      background: rgba(230, 32, 32, 0.12);
      outline: 1px dashed var(--accent);
      outline-offset: -1px;
      border-radius: 4px;
    }
    .track.drag-over .sample-btn {
      color: var(--accent);
      border-color: var(--accent);
    }

    .lock-btn, .track-export-btn {
      font-size: 0.65rem;
      padding: 1px 5px;
      background: #1a1a1a;
      color: var(--text-dim);
      border: 1px solid var(--border);
      border-radius: 3px;
      cursor: pointer;
      width: fit-content;
      line-height: 1.2;
      transition: all 0.15s ease;
    }
    .lock-btn:hover, .track-export-btn:hover { color: var(--text); background: #252525; }
    .lock-btn.locked {
      background: #2a1010;
      color: var(--accent);
      border-color: var(--accent-dim);
    }
    .track-export-btn:hover {
      color: var(--accent);
      border-color: var(--accent-dim);
    }
    .track-actions {
      display: flex;
      gap: 3px;
      flex-wrap: wrap;
      margin-top: 1px;
    }
    .track.locked-row {
      opacity: 0.8;
    }
    .track.locked-row .steps {
      position: relative;
    }
    .track.locked-row .steps::after {
      content: '';
      position: absolute;
      inset: 0;
      background: repeating-linear-gradient(
        -45deg,
        transparent,
        transparent 3px,
        rgba(230, 32, 32, 0.06) 3px,
        rgba(230, 32, 32, 0.06) 6px
      );
      pointer-events: none;
      border-radius: 3px;
    }

    .steps {
      display: grid;
      grid-template-columns: repeat(16, 1fr);
      gap: 3px;
    }

    .step {
      height: 28px;
      border-radius: 4px;
      border: 1px solid var(--border);
      background: var(--step-off);
      cursor: pointer;
      min-width: 0;
      transition: background 0.08s, box-shadow 0.08s;
    }

    .step:hover {
      border-color: #444;
    }

    .step.on {
      background: var(--step-on);
      box-shadow: 0 0 6px rgba(230, 32, 32, 0.45);
    }

    .step.playing {
      outline: 2px solid #fff;
      outline-offset: 0px;
    }

    /* Beat markers (every 4 steps) */
    .step:nth-child(4n+1)::after {
      content: '';
      position: absolute;
      bottom: -4px;
      left: 50%;
      transform: translateX(-50%);
      width: 3px;
      height: 3px;
      background: var(--accent);
      border-radius: 50%;
      opacity: 0.5;
    }

    .vol-wrap {
      display: flex;
      flex-direction: row;
      align-items: center;
      gap: 4px;
    }
    .vol-wrap input[type="range"] {
      width: 44px;
      height: 4px;
      writing-mode: horizontal-tb;
      -webkit-appearance: none;
      background: #2a2a2a;
    }

    .status {
      padding: 6px 12px;
      font-size: 0.68rem;
      color: var(--text-dim);
      background: #0d0d0d;
      border-top: 1px solid var(--border);
      text-align: center;
      flex-shrink: 0;
    }

    /* Color the active steps per track — red / white palette */
    .track.kick .step.on { background: var(--kick); box-shadow: 0 0 6px rgba(230,32,32,0.5); }
    .track.snare .step.on { background: var(--snare); box-shadow: 0 0 6px rgba(255,255,255,0.35); color: #000; }
    .track.closedhat .step.on { background: var(--hat); box-shadow: 0 0 5px rgba(192,192,192,0.3); }
    .track.openhat .step.on { background: var(--openhat); box-shadow: 0 0 5px rgba(224,224,224,0.3); }
    .track.clap .step.on { background: var(--clap); box-shadow: 0 0 6px rgba(255,85,85,0.4); }
    .track.perc .step.on { background: var(--perc); box-shadow: 0 0 5px rgba(136,136,136,0.3); }

    @media (max-width: 480px) {
      .track {
        grid-template-columns: 72px 1fr;
      }
      .vol-wrap { display: none; }
      .steps { gap: 2px; }
      h1 { font-size: 1rem; }
    }
  
    
    /* ===== Shared QOL ===== */
    h1 {
      letter-spacing: 0.16em !important;
      text-shadow: 0 0 20px rgba(230,32,32,0.35), 1px 0 0 rgba(255,60,60,0.15), -1px 0 0 rgba(60,120,255,0.1) !important;
    }
    button:focus-visible {
      outline: 1px solid var(--accent, #e62020);
      outline-offset: 2px;
    }
    input:focus-visible, select:focus-visible {
      outline: 1px solid var(--accent, #e62020);
      outline-offset: 1px;
    }
    ::selection {
      background: rgba(230, 32, 32, 0.35);
      color: #fff;
    }

    
    /* ===== VHS / dream-tape atmosphere (fixed — no layout shift) ===== */
    body.vhs-dream {
      /* scanlines/overlays handle VHS; no body filter so LEARN stays readable */
    }
    body.vhs-dream::before {
      content: '';
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 9998;
      background-image: repeating-linear-gradient(
        0deg,
        rgba(0, 0, 0, 0) 0px,
        rgba(0, 0, 0, 0) 2px,
        rgba(0, 0, 0, 0.11) 2px,
        rgba(0, 0, 0, 0.11) 3px
      );
      background-size: 100% 4px;
      background-repeat: repeat;
      opacity: 0.4;
      mix-blend-mode: multiply;
      /* animate background only — never transform (avoids visual jump) */
      animation: vhs-scan-bg 8s linear infinite;
      will-change: background-position;
      transform: none !important;
    }
    body.vhs-dream::after {
      content: '';
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 9999;
      background:
        radial-gradient(ellipse at center, transparent 42%, rgba(0, 0, 0, 0.48) 100%),
        linear-gradient(90deg, rgba(80, 0, 20, 0.05), transparent 14%, transparent 86%, rgba(0, 40, 60, 0.05));
      box-shadow: inset 0 0 100px rgba(60, 10, 15, 0.22);
      animation: vhs-flicker 6s infinite;
      transform: none !important;
      will-change: opacity;
    }
    @keyframes vhs-scan-bg {
      0% { background-position: 0 0; }
      100% { background-position: 0 4px; }
    }
    @keyframes vhs-flicker {
      0%, 100% { opacity: 1; }
      91% { opacity: 1; }
      92% { opacity: 0.94; }
      93% { opacity: 1; }
      97% { opacity: 0.97; }
      98% { opacity: 1; }
    }
    /* Soft chroma fringe on panels */
    .app, .machine-card, .builder-hero, .session-chip, .app-frame {
      box-shadow:
        0 0 0 1px rgba(0,0,0,0.8),
        1px 0 0 rgba(255, 40, 40, 0.06),
        -1px 0 0 rgba(40, 120, 255, 0.05),
        0 12px 40px rgba(0,0,0,0.55) !important;
    }

      92% { opacity: 0.94; }
      93% { opacity: 1; }
      97% { opacity: 0.97; }
      98% { opacity: 1; }
    }
    /* Soft chroma fringe on panels */
    .app, .machine-card, .builder-hero, .session-chip {
      box-shadow:
        0 0 0 1px rgba(0,0,0,0.8),
        1px 0 0 rgba(255, 40, 40, 0.06),
        -1px 0 0 rgba(40, 120, 255, 0.05),
        0 12px 40px rgba(0,0,0,0.55) !important;
    }

  
    /* ===== Mobile / phone production layout ===== */
    @media (max-width: 720px) {
      html, body.vhs-dream, body {
        overflow-x: hidden !important;
        overflow-y: auto !important;
        height: auto !important;
        min-height: 100dvh;
        padding: 0 !important;
        align-items: stretch !important;
        justify-content: flex-start !important;
        filter: none; /* keep VHS overlays, drop heavy body filter on phones */
      }
      h1 { font-size: 1.15rem !important; margin: 8px 12px 4px !important; }
      .subtitle { font-size: 0.72rem !important; padding: 0 12px 8px !important; }
      .app-frame {
        width: 100% !important;
        height: auto !important;
        max-width: 100% !important;
        --ui-scale: 1 !important;
      }
      .app {
        width: 100% !important;
        height: auto !important;
        min-height: 100dvh !important;
        max-width: 100% !important;
        max-height: none !important;
        border-radius: 0 !important;
        transform: none !important;
        overflow: visible !important;
      }
      .body-scroll, .body {
        overflow: visible !important;
        max-height: none !important;
        -webkit-overflow-scrolling: touch;
      }
      .controls, .controls-left, .controls-right {
        flex-wrap: wrap !important;
        width: 100%;
        justify-content: flex-start !important;
      }
      button, .btn-primary, .btn-secondary, .btn-play, .mode-btn, .sync-btn {
        min-height: 42px;
        padding: 8px 12px;
      }
      input[type="range"] { min-height: 32px; width: 100%; }
      .param-grid, .fx-params {
        grid-template-columns: 1fr 1fr !important;
      }
      .fx-row { padding: 8px !important; }
    }

  
    .ns-chip, .sm-chip {
      min-height: 32px;
      padding: 6px 10px;
      border: 1px solid #4a2030;
      background: #1a0c12;
      color: #c9a0a8;
      font-size: 0.62rem;
      letter-spacing: 0.08em;
      font-weight: 700;
      cursor: pointer;
      font-family: inherit;
      border-radius: 4px;
    }
    .ns-chip.on, .sm-chip.on {
      background: #3a1020;
      border-color: #e62020;
      color: #ffb0b8;
      box-shadow: 0 0 10px rgba(230,32,32,0.25);
    }

  

    /* Sample library — DreamDraw-style folders */
    .lib-box {
      margin: 0; padding: 0; border-bottom: 1px solid var(--border);
      background: #0a0808; max-height: 200px; overflow: auto;
    }
    .lib-title {
      font-size: 0.6rem; letter-spacing: 0.08em; color: #c9a0a8;
      padding: 6px 10px 4px; font-weight: 700;
      position: sticky; top: 0; background: #140a0a; z-index: 1;
      border-bottom: 1px solid #2a1818;
    }
    .sw-lib-folder { margin: 4px 6px; }
    .sw-lib-folder > summary {
      cursor: pointer; list-style: none; font-size: 0.6rem; color: #c9a090;
      padding: 4px 6px; letter-spacing: 0.05em; border-radius: 4px;
    }
    .sw-lib-folder > summary::-webkit-details-marker { display: none; }
    .sw-lib-folder > summary:hover { color: #ffb0b0; background: #1a1010; }
    .sw-lib-item {
      display: block; width: 100%; text-align: left; font-family: inherit;
      font-size: 0.62rem; padding: 5px 8px; margin: 1px 0; border-radius: 4px;
      border: 1px solid transparent; background: transparent; color: #ddd; cursor: pointer;
    }
    .sw-lib-item:hover { background: #1a1010; border-color: #3a2020; color: #fff; }
    .sw-lib-item.session { color: #b0ffb0; }
    .sw-lib-empty { font-size: 0.6rem; color: #666; padding: 10px; }
    .lib-refresh-row {
      display: flex; gap: 6px; padding: 4px 8px 6px; align-items: center;
    }
    .lib-refresh-row button {
      font-size: 0.58rem; padding: 3px 8px; border-radius: 3px;
      border: 1px solid #5a2020; background: #1a1010; color: #ffb0b0; cursor: pointer;
    }


    .drum-grade {
      pointer-events: none;
      position: fixed;
      inset: 0;
      z-index: 8;
      background: radial-gradient(ellipse at 20% 0%, rgba(230,40,40,0.16), transparent 55%), repeating-linear-gradient(180deg, rgba(0,0,0,0.12) 0 1px, transparent 1px 4px);
      mix-blend-mode: overlay;
      opacity: 0.85;
    }



.learn-btn { letter-spacing: 0.12em; font-weight: 700; }
    .learn-btn.on { background: #102418; border-color: #7cff6b; color: #c8ff9a; box-shadow: 0 0 10px rgba(124,255,107,0.25); }
    .learn-dock {
      display: none;
      position: fixed;
      left: 12px;
      bottom: 12px;
      z-index: 2147483000;
      max-width: min(520px, calc(100vw - 24px));
      padding: 12px 14px;
      background: #140a0a;
      border: 1px solid #7cff6b;
      color: #f4efe8;
      font-size: 0.92rem;
      line-height: 1.45;
      letter-spacing: 0.02em;
      pointer-events: none;
      mix-blend-mode: normal !important;
      filter: none !important;
      isolation: isolate;
      box-shadow: 0 10px 28px rgba(0,0,0,0.7);
    }
    .learn-dock.show { display: block; }
    html:not(.learn-on) .learn-dock { display: none !important; }
    .learn-dock b { display: block; color: #7cff6b; letter-spacing: 0.14em; font-size: 0.72rem; margin-bottom: 4px; }
    @media (max-width: 720px) {
      .learn-dock {
        left: 8px; right: 8px; bottom: 8px; max-width: none;
        font-size: 0.86rem; padding: 10px 12px;
      }
    }


  
    /* Pack mode selector (replaces sample browser) */
    .pack-mode-box {
      border-bottom: 1px solid var(--border);
      background: linear-gradient(180deg, #140c0c 0%, #0c0a0a 100%);
      padding: 12px 12px 14px;
    }
    .pack-mode-title {
      font-size: 0.68rem;
      letter-spacing: 0.14em;
      font-weight: 800;
      color: #ffb0b0;
      margin-bottom: 8px;
    }
    .pack-mode-title span {
      color: var(--text-dim);
      font-weight: 600;
      letter-spacing: 0.04em;
      font-size: 0.6rem;
      margin-left: 8px;
    }
    .pack-mode-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
    }

    function createLowLagAudioContext() {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) throw new Error('Web Audio not supported');
      try { return new AC({ latencyHint: 'interactive', sampleRate: 48000 }); }
      catch (e1) {

    /** Per-role mix trim — balanced kit; Suicide is the only extreme boost */
    const ROLE_GAIN = {
      kick: 0.62,
      snare: 0.58,
      closedhat: 0.36,
      openhat: 0.32,
      clap: 0.52,
      perc: 0.42
    };
    function roleGain(trackId) {
      return ROLE_GAIN[trackId] != null ? ROLE_GAIN[trackId] : 0.5;
    }
    function mixGain(trackId, velocity) {
      const user = (volumes[trackId] != null ? volumes[trackId] : 0.8);
      const vel = (velocity != null ? velocity : 0.8);

    function toggleLock(trackId, btn, row) {

    /** Stable ~1/3 of cells render as pills so the grid feels organic */
    function isPillStep(trackId, step) {
      let h = 2166136261;
      const s = String(trackId) + ':' + String(step);
      for (let i = 0; i < s.length; i++) {
        h ^= s.charCodeAt(i);
        h = Math.imul(h, 16777619);
      }
      return ((h >>> 0) % 100) < 34; // ~34% pills
    }

    function toggleStep(trackId, step) {
      patterns[trackId][step] = patterns[trackId][step] ? 0 : 1;
      if (patterns[trackId][step]) {
        velocities[trackId][step] = 0.7 + Math.random() * 0.3;
      }
      updateStepUI(trackId, step);

    function updateStepUI(trackId, step) {
      const el = document.querySelector(`.step[data-track="${trackId}"][data-step="${step}"]`);

        if (patterns[trackId][step] && el.classList.contains('pill')) {

    }

    // ========== Sample Loading ==========
    function guessDrumTrack(name) {

      if (/kick|bd\b|bassdrum|bass.?drum/.test(n)) return 'kick';
      if (/snare|sd\b|snr/.test(n)) return 'snare';
      if (/clap/.test(n)) return 'clap';
      if (/open.?hat|ohh|ohat/.test(n)) return 'openhat';
      if (/closed.?hat|chh|chat|hihat|hi.?hat|hat/.test(n)) return 'closedhat';
      if (/perc|tom|ride|crash|shaker|rim|cow|stick/.test(n)) return 'perc';

    }
    function browseSample(trackId, btn) {

    async function loadSampleUrl(trackId, url, name) {

    async function loadSampleFile(trackId, file, btn) {
      try {
        if (!audioCtx) audioCtx = createLowLagAudioContext();

    // ========== Audio Engine ==========
    function ensureCtx() {
      if (!audioCtx) {
        audioCtx = createLowLagAudioContext();
      }
      if (audioCtx.state === 'suspended') audioCtx.resume();
      return audioCtx;
    }

    
    let _drumMaster = null;
    function getDrumMaster(ctx) {
      if (!ctx) return null;
      if (_drumMaster && _drumMaster.ctx === ctx) return _drumMaster.input;
      const input = ctx.createGain();
      input.gain.value = 1;
      const comp = ctx.createDynamicsCompressor();
      comp.threshold.value = -18;
      comp.knee.value = 14;
      comp.ratio.value = 3.5;
      comp.attack.value = 0.003;
      comp.release.value = 0.12;
      const lim = ctx.createDynamicsCompressor();
      lim.threshold.value = -9;
      lim.knee.value = 2;
      lim.ratio.value = 16;
      lim.attack.value = 0.002;
      lim.release.value = 0.08;
      const pad = ctx.createGain();
      pad.gain.value = 0.68;
      input.connect(comp); comp.connect(lim); lim.connect(pad);
      _drumMaster = { ctx: ctx, input: input, pad: pad };
      return input;
    }

    function playSound(trackId, time, velocity = 0.85) {
      const buffer = buffers[trackId];
      if (!buffer) return;
      const ctx = ensureCtx();
      const source = ctx.createBufferSource();
      source.buffer = buffer;
      const gain = ctx.createGain();
      const vol = mixGain(trackId, velocity);
      gain.gain.setValueAtTime(vol, time);
      // Gentle fade to avoid clicks on short one-shots
      const dur = Math.min(buffer.duration, 2.0);
      gain.gain.exponentialRampToValueAtTime(0.001, time + dur);
      source.connect(gain);
      const _bus = getDrumMaster(ctx);
      try {
        if (_drumMaster && _drumMaster.pad) {
          try { _drumMaster.pad.disconnect(); } catch(_d){}
          _drumMaster.pad.connect(getMasterModeDest(ctx));
        }
      } catch(_e){}
      gain.connect(applyDrumFx(ctx, applySuicideFx(ctx, _bus || getMasterModeDest(ctx), trackId), trackId));
      source.start(time);
      source.stop(time + dur + 0.05);
    }

    // Look-ahead scheduler
    const scheduleAheadTime = 0.1;
    const lookahead = 25; // ms

    function secondsPerStep() {
      return (60 / bpm) / 4; // 16th notes at current BPM
    }

    function nextNote() {
      const sp = secondsPerStep();
      // Apply swing to odd 16ths (steps 1,3,5...)
      let swingOffset = 0;
      if (currentStep % 2 === 1) {
        swingOffset = sp * swingAmount * 0.5; // max half a 16th
      }
      nextNoteTime += sp + (currentStep % 2 === 0 ? 0 : 0); // base advance is always sp; swing is offset on play
      // Actually better: advance always by sp, but play time has swing on the odd steps
      currentStep = (currentStep + 1) % STEPS;
    }

    // Corrected scheduler
    let stepTime = 0; // cumulative

    function scheduler() {
      const ctx = ensureCtx();
      while (nextNoteTime < ctx.currentTime + scheduleAheadTime) {
        scheduleStep(currentStep, nextNoteTime);
        advanceNote();
      }
      timerID = setTimeout(scheduler, lookahead);
    }

    function advanceNote() {
      const sp = secondsPerStep();
      // For swing: we still advance the "grid" by sp, but the actual play time of odd steps is delayed
      nextNoteTime += sp;
      currentStep = (currentStep + 1) % STEPS;
    }

    function scheduleStep(step, time) {
      // Swing: delay every 2nd 16th (odd indices)
      let playTime = time;
      if (step % 2 === 1) {
        playTime += secondsPerStep() * swingAmount * 0.55;
      }

      TRACKS.forEach(t => {
        if (patterns[t.id][step]) {
          const vel = velocities[t.id][step] || 0.85;
          playSound(t.id, playTime, vel);
        }
      });

      // Visual highlight (slightly delayed to match)
      const visualDelay = Math.max(0, (playTime - ensureCtx().currentTime) * 1000 - 10);
      setTimeout(() => highlightStep(step), visualDelay);
    }

    function highlightStep(step) {
      document.querySelectorAll('.step.playing').forEach(el => el.classList.remove('playing'));
      document.querySelectorAll(`.step[data-step="${step}"]`).forEach(el => el.classList.add('playing'));
    }

    function start() {
      ensureCtx();
      if (isPlaying) return;
      isPlaying = true;
      currentStep = 0;
      nextNoteTime = audioCtx.currentTime + 0.05;
      playBtn.textContent = '⏸ Pause';
      playBtn.classList.add('playing');
      scheduler();
      setStatus('Playing…');
    }

    function stop() {
      isPlaying = false;
      clearTimeout(timerID);
      playBtn.textContent = '▶ Play';
      playBtn.classList.remove('playing');
      document.querySelectorAll('.step.playing').forEach(el => el.classList.remove('playing'));
      currentStep = 0;
      setStatus('Stopped.');
    }

    // ========== Randomize (musical Lofi patterns) ==========
    function rand() { return Math.random(); }
    function chance(p) { return rand() < p; }

    function setStatus(msg) {
      if (statusEl) statusEl.textContent = msg || '';
    }

    function clearAll() {
      TRACKS.forEach(t => {
        if (locked[t.id]) return;
        for (let i = 0; i < STEPS; i++) {
          patterns[t.id][i] = 0;
          velocities[t.id][i] = 0.85;
        }
      });
      updateAllStepsUI();
      const lockedNames = TRACKS.filter(t => locked[t.id]).map(t => t.name);
      setStatus(lockedNames.length
        ? ('Cleared unlocked tracks. Still locked: ' + lockedNames.join(', '))
        : 'Pattern cleared.');
    }

    function stampLine(p, steps) {
      for (let i = 0; i < STEPS; i++) p[i] = 0;
      (steps || []).forEach(function(s) {
        if (s >= 0 && s < STEPS) p[s] = 1;
      });
    }
    function pickLine(lines) {
      if (!lines || !lines.length) return [];
      return lines[Math.floor(rand() * lines.length)].slice();
    }
    function sprinkle(p, slots, prob) {
      (slots || []).forEach(function(s) { if (chance(prob)) p[s] = 1; });
    }
    function humanizeVels(p, v, lo, hi) {
      lo = (lo == null) ? 0.62 : lo;
      hi = (hi == null) ? 1 : hi;
      for (let i = 0; i < STEPS; i++) {
        v[i] = p[i] ? (lo + rand() * (hi - lo)) : 0.85;
      }
      if (p[0]) v[0] = Math.min(1, v[0] + 0.12);
      if (p[4]) v[4] = Math.min(1, v[4] + 0.06);
      if (p[8]) v[8] = Math.min(1, v[8] + 0.08);
      if (p[12]) v[12] = Math.min(1, v[12] + 0.06);
    }

    function activeGenre() {
      const pack = (currentDrumPack && DRUM_PACKS.indexOf(currentDrumPack) >= 0) ? currentDrumPack : null;
      return pack || 'LIQUID';

    function randomize() {
      const genre = activeGenre();
      const book = GENRE_LINES[genre] || GENRE_LINES.LIQUID;
      TRACKS.forEach(function(t) {
        if (locked[t.id]) return;
        const p = patterns[t.id];
        const v = velocities[t.id];
        stampLine(p, pickLine(book[t.id] || [[]]));
        if (genre === 'HEAVY' && t.id === 'kick' && chance(0.4)) sprinkle(p, [1,2,9], 0.45);
        if (genre === 'HEAVY' && t.id === 'snare' && chance(0.35)) sprinkle(p, [13,14,15], 0.5);
        if (genre === 'CRUNCH' && t.id === 'snare' && chance(0.4)) { p[13]=1; p[14]=1; if (chance(0.6)) p[15]=1; }
        if (genre === 'SMOOTH' && t.id === 'snare') sprinkle(p, [3,6,7,11,15], 0.28);
        if (genre === 'LIQUID' && t.id === 'kick') sprinkle(p, [6,14], 0.22);
        if (genre === 'CLANKER' && t.id === 'closedhat' && chance(0.35)) {
          const start = 12 + Math.floor(rand() * 3);
          for (let i = start; i < STEPS; i++) p[i] = 1;
        }
        if (genre === 'PERKS' && t.id === 'perc') sprinkle(p, [1,4,7,9,12,15], 0.3);
        if (genre === 'CLANKER' && t.id === 'perc' && chance(0.3)) sprinkle(p, [13,14,15], 0.7);
        const velRange = {
          HEAVY: [0.72, 1], CRUNCH: [0.7, 0.98], SMOOTH: [0.5, 0.88],
          LIQUID: [0.55, 0.92], CLANKER: [0.6, 1], PERKS: [0.48, 0.9]
        }[genre] || [0.6, 0.95];
        humanizeVels(p, v, velRange[0], velRange[1]);
        if (genre === 'SMOOTH' && t.id === 'snare') {
          [3,6,7,11,15].forEach(function(s){ if (p[s]) v[s] = 0.28 + rand() * 0.28; });
        }
      });
      updateAllStepsUI();
      const label = PACK_DESC[genre] || genre;
      setStatus('Pattern · ' + genre + ' (' + label + ') · locked lanes kept');
    }

    function writeString(view, offset, string) {
      for (let i = 0; i < string.length; i++) view.setUint8(offset + i, string.charCodeAt(i));
    }

    
    function dreamNormalizeBuffer(ab, targetPeak) {
      if (!ab || typeof ab.getChannelData !== 'function') return ab;
      if (typeof window.dreamNormalizeBuffer === 'function' && window.dreamNormalizeBuffer !== dreamNormalizeBuffer) {
        return window.dreamNormalizeBuffer(ab, targetPeak);
      }
      const target = (typeof targetPeak === 'number' && targetPeak > 0) ? targetPeak : 0.85;
      let peak = 0;
      const chs = ab.numberOfChannels | 0;
      const n = ab.length | 0;
      for (let c = 0; c < chs; c++) {
        const d = ab.getChannelData(c);
        for (let i = 0; i < n; i++) {
          const a = d[i] < 0 ? -d[i] : d[i];
          if (a > peak) peak = a;
        }
      }
      if (!(peak > 1e-8)) return ab;
      const g = target / peak;
      for (let c = 0; c < chs; c++) {
        const d = ab.getChannelData(c);
        for (let i = 0; i < n; i++) d[i] *= g;
      }
      return ab;
    }

function encodeWAV(audioBuffer) {
      try { audioBuffer = dreamNormalizeBuffer(audioBuffer, 0.72) || audioBuffer; } catch (_n) {}

      const numChannels = audioBuffer.numberOfChannels;
      const sampleRate = audioBuffer.sampleRate;
      const bytesPerSample = 2;
      const blockAlign = numChannels * bytesPerSample;
      const samples = audioBuffer.length;
      const dataLength = samples * blockAlign;
      const buffer = new ArrayBuffer(44 + dataLength);
      const view = new DataView(buffer);
      writeString(view, 0, 'RIFF');
      view.setUint32(4, 36 + dataLength, true);
      writeString(view, 8, 'WAVE');
      writeString(view, 12, 'fmt ');
      view.setUint32(16, 16, true);
      view.setUint16(20, 1, true);
      view.setUint16(22, numChannels, true);
      view.setUint32(24, sampleRate, true);
      view.setUint32(28, sampleRate * blockAlign, true);
      view.setUint16(32, blockAlign, true);
      view.setUint16(34, 16, true);
      writeString(view, 36, 'data');
      view.setUint32(40, dataLength, true);
      let offset = 44;
      const channels = [];
      for (let c = 0; c < numChannels; c++) channels.push(audioBuffer.getChannelData(c));
      for (let i = 0; i < samples; i++) {
        for (let c = 0; c < numChannels; c++) {
          let sample = Math.max(-1, Math.min(1, channels[c][i]));
          sample = sample < 0 ? sample * 0x8000 : sample * 0x7FFF;
          view.setInt16(offset, sample, true);
          offset += 2;
        }
      }
      return buffer;
    }

    function scheduleTrackHit(offline, trackId, time, velocity, dest) {
      const buffer = buffers[trackId];
      if (!buffer) return;
      const source = offline.createBufferSource();
      source.buffer = buffer;
      const gain = offline.createGain();
      const vol = mixGain(trackId, velocity);
      gain.gain.setValueAtTime(vol, time);
      const dur = Math.min(buffer.duration, 2.0);
      try {
        gain.gain.exponentialRampToValueAtTime(0.001, time + dur);
      } catch (_) {
        gain.gain.linearRampToValueAtTime(0, time + dur);
      }
      source.connect(gain);
      const chainIn = applyDrumFx(offline, applySuicideFx(offline, dest, trackId), trackId);
      gain.connect(chainIn);
      source.start(time);
      try { source.stop(time + dur + 0.05); } catch (_) {}
    }

    async function renderPatternBuffer(onlyTrackId) {
      ensureCtx();
      const sr = audioCtx.sampleRate || SAMPLE_RATE;
      const sp = (60 / getBpm()) / 4;
      const totalSteps = STEPS * barsToExport;
      const duration = totalSteps * sp + 0.5;
      const offline = new OfflineAudioContext(2, Math.ceil(duration * sr), sr);
      _modeTap = null;
      const master = getMasterModeDest(offline, offline.destination);

      for (let barStep = 0; barStep < totalSteps; barStep++) {
        const step = barStep % STEPS;
        let t = barStep * sp;
        if (step % 2 === 1) t += sp * swingAmount * 0.55;
        TRACKS.forEach(tr => {
          if (onlyTrackId && tr.id !== onlyTrackId) return;
          if (patterns[tr.id][step]) {
            const vel = velocities[tr.id][step] || 0.85;
            scheduleTrackHit(offline, tr.id, t, vel, master);
          }
        });
      }
      let rendered = await offline.startRendering();
      rendered = await bounceMasterModes(rendered);
      try { rendered = dreamNormalizeBuffer(rendered, 0.72) || rendered; } catch (_n) {}
      return rendered;
    }

    async function exportWAV() {
      try {
        const hasAny = TRACKS.some(t => buffers[t.id] && patterns[t.id].some(Boolean));
        if (!hasAny) {
          setStatus('Load samples and place some steps before export.');
          return;
        }
        setStatus('Rendering ' + barsToExport + '-bar WAV…');
        const rendered = await renderPatternBuffer(null);
        const wav = encodeWAV((dreamNormalizeBuffer(rendered,0.72)||rendered));
        const blob = new Blob([wav], { type: 'audio/wav' });
        const fname = dreamTapeName() + '.wav';
        if (!window._DREAM_SAVE_ONLY) dreamForceDownload(blob, fname);
        await dreamSaveBlob(blob, fname);
        setStatus('Exported ' + fname + ' · ' + barsToExport + ' bars @ ' + getBpm() + ' BPM');
      } catch (err) {
        console.error(err);
        setStatus('Export failed: ' + (err && err.message ? err.message : err));
      }
    }

    async function exportSingleTrack(trackId) {
      try {
        if (!buffers[trackId]) {
          setStatus('No sample on that track.');
          return;
        }
        if (!patterns[trackId].some(Boolean)) {
          setStatus('No steps on that track.');
          return;
        }
        setStatus('Rendering track…');
        const rendered = await renderPatternBuffer(trackId);
        const wav = encodeWAV((dreamNormalizeBuffer(rendered,0.72)||rendered));
        const blob = new Blob([wav], { type: 'audio/wav' });
        const fname = dreamTapeName() + '_' + trackId + '.wav';
        if (!window._DREAM_SAVE_ONLY) dreamForceDownload(blob, fname);
        await dreamSaveBlob(blob, fname);
        setStatus('Exported ' + trackId + ' → ' + fname);
      } catch (err) {
        console.error(err);
        setStatus('Track export failed.');
      }
    }

    function hashTrack(id) {
      let h = suicideSeed * 9973;
      const s = String(id || '');
      for (let i = 0; i < s.length; i++) h = (h * 33 + s.charCodeAt(i)) >>> 0;
      return h;
    }
    function suicideUnit(h, n) {
      const x = Math.sin((h + n * 19.17) * 12.9898) * 43758.5453;
      return x - Math.floor(x);
    }
    function suicideParams(trackId) {
      const h = hashTrack(trackId);
      const u = (n) => suicideUnit(h, n);
      const role = String(trackId || '');
      const kick = role === 'kick';
      const hat = role.indexOf('hat') >= 0;
      const snare = role === 'snare' || role === 'clap';
      const bpm = (typeof getBpm === 'function') ? getBpm() : 120;
      const beat = 60 / Math.max(60, bpm);
      return {
        // 1 rumble HPF — keep kick near 30–40 Hz (audible kick fundamental band)
        rumbleHz: kick ? 28 + u(1) * 12 : 45 + u(1) * 30,
        // 2 body peak — Helmholtz-ish shell / skin
        bodyHz: kick ? 55 + u(2) * 40 : snare ? 180 + u(2) * 70 : hat ? 400 + u(2) * 200 : 140 + u(2) * 80,
        bodyGain: kick ? 2.2 + u(3) * 2 : snare ? 1.4 + u(3) * 1.6 : 0.6 + u(3) * 1.2,
        // 3 boxiness cut ~250–400
        boxHz: 280 + u(4) * 140,
        boxCut: -1.2 - u(5) * 2.2,
        // 4 stick / presence dip 2.5–4.5k
        stickHz: 2800 + u(6) * 1800,
        stickCut: hat ? -1.5 - u(7) * 2 : -0.8 - u(7) * 1.8,
        // 5 air shelf
        airHz: 7500 + u(8) * 3500,
        airGain: -1.2 - u(9) * 3.2,
        // 6 tone LPF
        toneHz: hat ? 7000 + u(10) * 5000 : 4200 + u(10) * 4500,
        // 7 tape drive
        drive: 0.1 + u(11) * 0.32,
        // 8 soft ceiling
        ceil: 0.08 + u(12) * 0.18,
        // 9 transient pre-delay (smooth attack)
        preMs: (hat ? 0.4 : 0.8) + u(13) * 1.6,
        // 10 Haas smear (5–18 ms, under echo threshold)
        haas: 0.006 + u(14) * 0.012,
        smear: hat ? 0.05 + u(15) * 0.08 : 0.08 + u(15) * 0.14,
        // 11 tape wow
        wowHz: 0.12 + u(16) * 0.28,
        wowAmt: 0.0015 + u(17) * 0.003,
        // 12 flutter
        flutHz: 5.5 + u(18) * 4.5,
        flutAmt: 0.00025 + u(19) * 0.0005,
        // 13 musical slap — 1/16 or dotted 1/16
        slap: beat * (u(20) < 0.5 ? 0.25 : 0.375),
        slapWet: 0.04 + u(21) * 0.08,
        // 14 short plate feedback
        plate: beat * 0.125,
        plateFb: 0.08 + u(22) * 0.16,
        plateWet: 0.05 + u(23) * 0.1,
        // 15 interval comb (4:3 fourth or 3:2 fifth)
        combRatio: u(24) < 0.5 ? 4 / 3 : 3 / 2,
        combWet: hat ? 0.03 + u(25) * 0.05 : 0.02 + u(25) * 0.04,
        // 16 mid glue 600–1k
        glueHz: 620 + u(26) * 380,
        glueGain: 0.6 + u(27) * 1.4,
        // 17 low shelf warmth
        warmHz: kick ? 90 : 140,
        warmGain: 0.8 + u(28) * 1.6,
        // 18 dark tilt
        tilt: -0.6 - u(29) * 1.8,
        // 19 pulse at 1/8 or 1/4 (very shallow)
        pulseHz: (u(30) < 0.5 ? 2 : 1) * (bpm / 60),
        pulseAmt: 0.04 + u(31) * 0.08,
        // 20 crush dust
        crush: u(32) < 0.35 ? 0.08 + u(33) * 0.18 : 0
      };
    }
    function suicideCurve(amount) {
      const n = 256, c = new Float32Array(n);
      const k = amount * 10;
      for (let i = 0; i < n; i++) {
        const x = (i / (n - 1)) * 2 - 1;
        c[i] = (1 + k) * x / (1 + k * Math.abs(x));
      }
      return c;
    }
    function applySuicideFx(ctx, dest, trackId) {
      if (!suicideOn) return dest;
      const p = suicideParams(trackId);
      const input = ctx.createGain();
      let node = input;

      const pre = ctx.createDelay(0.01);
      pre.delayTime.value = p.preMs / 1000;
      node.connect(pre); node = pre;

      const warm = ctx.createBiquadFilter();
      warm.type = 'lowshelf'; warm.frequency.value = p.warmHz; warm.gain.value = p.warmGain;
      node.connect(warm); node = warm;

      const sat = ctx.createWaveShaper(); sat.curve = suicideCurve(p.drive);
      node.connect(sat); node = sat;

      const rumble = ctx.createBiquadFilter();
      rumble.type = 'highpass'; rumble.frequency.value = p.rumbleHz; rumble.Q.value = 0.7;
      node.connect(rumble); node = rumble;

      const body = ctx.createBiquadFilter();
      body.type = 'peaking'; body.frequency.value = p.bodyHz; body.gain.value = p.bodyGain; body.Q.value = 1.1;
      node.connect(body); node = body;

      const box = ctx.createBiquadFilter();
      box.type = 'peaking'; box.frequency.value = p.boxHz; box.gain.value = p.boxCut; box.Q.value = 0.9;
      node.connect(box); node = box;

      const glue = ctx.createBiquadFilter();
      glue.type = 'peaking'; glue.frequency.value = p.glueHz; glue.gain.value = p.glueGain; glue.Q.value = 0.7;
      node.connect(glue); node = glue;

      const stick = ctx.createBiquadFilter();
      stick.type = 'peaking'; stick.frequency.value = p.stickHz; stick.gain.value = p.stickCut; stick.Q.value = 0.8;
      node.connect(stick); node = stick;

      const tone = ctx.createBiquadFilter();
      tone.type = 'lowpass'; tone.frequency.value = p.toneHz; tone.Q.value = 0.55;
      node.connect(tone); node = tone;

      const air = ctx.createBiquadFilter();
      air.type = 'highshelf'; air.frequency.value = p.airHz; air.gain.value = p.airGain;
      node.connect(air); node = air;

      const tilt = ctx.createBiquadFilter();
      tilt.type = 'highshelf'; tilt.frequency.value = 2500; tilt.gain.value = p.tilt;
      node.connect(tilt); node = tilt;

      if (p.crush > 0.02) {
        const cr = ctx.createWaveShaper();
        const n = 128, c = new Float32Array(n);
        const steps = Math.max(6, Math.round(28 - p.crush * 20));
        for (let i = 0; i < n; i++) {
          const x = (i / (n - 1)) * 2 - 1;
          c[i] = Math.round(x * steps) / steps;
        }
        cr.curve = c;
        node.connect(cr); node = cr;
      }

      const ceil = ctx.createWaveShaper(); ceil.curve = suicideCurve(p.ceil);
      node.connect(ceil); node = ceil;

      const dly = ctx.createDelay(0.08);
      dly.delayTime.value = p.haas;
      const wow = ctx.createOscillator(); wow.type = 'sine'; wow.frequency.value = p.wowHz;
      const wg = ctx.createGain(); wg.gain.value = p.wowAmt;
      wow.connect(wg); wg.connect(dly.delayTime);
      const flut = ctx.createOscillator(); flut.type = 'sine'; flut.frequency.value = p.flutHz;
      const fg = ctx.createGain(); fg.gain.value = p.flutAmt;
      flut.connect(fg); fg.connect(dly.delayTime);
      try { wow.start(); flut.start(); wow.stop(ctx.currentTime + 2.2); flut.stop(ctx.currentTime + 2.2); } catch (_) {}
      const smearG = ctx.createGain(); smearG.gain.value = p.smear;
      const dryG = ctx.createGain(); dryG.gain.value = 1 - p.smear * 0.5;
      const mix = ctx.createGain();
      node.connect(dryG); dryG.connect(mix);
      node.connect(dly); dly.connect(smearG); smearG.connect(mix);
      node = mix;

      const slap = ctx.createDelay(0.4);
      slap.delayTime.value = Math.min(0.38, p.slap);
      const slapG = ctx.createGain(); slapG.gain.value = p.slapWet;
      const afterSlap = ctx.createGain();
      node.connect(afterSlap);
      node.connect(slap); slap.connect(slapG); slapG.connect(afterSlap);
      node = afterSlap;

      const plate = ctx.createDelay(0.3);
      plate.delayTime.value = Math.min(0.28, p.plate);
      const pfb = ctx.createGain(); pfb.gain.value = p.plateFb;
      const pwet = ctx.createGain(); pwet.gain.value = p.plateWet;
      plate.connect(pfb); pfb.connect(plate);
      const afterPlate = ctx.createGain();
      node.connect(afterPlate);
      node.connect(plate); plate.connect(pwet); pwet.connect(afterPlate);
      node = afterPlate;

      const comb = ctx.createDelay(0.05);
      comb.delayTime.value = Math.min(0.045, p.haas * p.combRatio);
      const cw = ctx.createGain(); cw.gain.value = p.combWet;
      const afterComb = ctx.createGain();
      node.connect(afterComb);
      node.connect(comb); comb.connect(cw); cw.connect(afterComb);
      node = afterComb;

      const pulse = ctx.createGain();
      pulse.gain.value = 1;
      const lfo = ctx.createOscillator(); lfo.type = 'sine'; lfo.frequency.value = p.pulseHz;
      const pg = ctx.createGain(); pg.gain.value = p.pulseAmt;
      lfo.connect(pg); pg.connect(pulse.gain);
      try { lfo.start(); lfo.stop(ctx.currentTime + 2.2); } catch (_) {}
      node.connect(pulse);
      // Suicide is allowed to push level — intentional extreme
      const makeup = ctx.createGain();
      makeup.gain.value = 0.95 + (p.bodyGain || 1) * 0.04;

    function applyDrumFx(ctx, dest, trackId) {
      if (!drumFxOn) return dest;
      const fx = Object.assign({}, drumFx, (trackId && trackFx[trackId]) || {});
      const punch = fx.punch || 0;
      const crush = fx.crush || 0;
      const tone = fx.tone || 12000;
      const space = fx.space || 0;
      const input = ctx.createGain();
      let head = input;
      if ((fx.hpf || 0) > 20) {
        const hp = ctx.createBiquadFilter(); hp.type = 'highpass'; hp.frequency.value = fx.hpf;
        head.connect(hp); head = hp;
      }
      if (punch > 0.02 || (fx.drive || 0) > 0.02) {
        const amt = Math.max(punch, fx.drive || 0);
        const sh = ctx.createWaveShaper();
        const n = 256, c = new Float32Array(n);
        const k = amt * 12;
        for (let i = 0; i < n; i++) {
          const x = (i / (n - 1)) * 2 - 1;
          c[i] = (1 + k) * x / (1 + k * Math.abs(x));
        }
        sh.curve = c;
        head.connect(sh); head = sh;
      }
      if (crush > 0.02) {
        const sh = ctx.createWaveShaper();
        const n = 256, c = new Float32Array(n);
        const steps = Math.max(4, Math.round(32 - crush * 28));
        for (let i = 0; i < n; i++) {
          const x = (i / (n - 1)) * 2 - 1;
          c[i] = Math.round(x * steps) / steps;
        }
        sh.curve = c;
        const lp = ctx.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 10000 - crush * 5000;
        head.connect(sh); sh.connect(lp); head = lp;
      }
      const lp = ctx.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = tone;
      head.connect(lp); head = lp;
      if ((fx.chorus || 0) > 0.05) {
        const d = ctx.createDelay(0.05); d.delayTime.value = 0.014;
        const lfo = ctx.createOscillator(); lfo.frequency.value = 0.4 + fx.chorus;
        const lg = ctx.createGain(); lg.gain.value = 0.003 * fx.chorus;
        lfo.connect(lg); lg.connect(d.delayTime);
        try { lfo.start(); lfo.stop(ctx.currentTime + 2); } catch(_){}
        const wet = ctx.createGain(); wet.gain.value = fx.chorus * 0.18;
        const mix = ctx.createGain();
        head.connect(mix); head.connect(d); d.connect(wet); wet.connect(mix); head = mix;
      }
      if ((fx.flanger || 0) > 0.05) {
        const d = ctx.createDelay(0.02); d.delayTime.value = 0.004;
        const lfo = ctx.createOscillator(); lfo.frequency.value = 0.2 + fx.flanger * 0.8;
        const lg = ctx.createGain(); lg.gain.value = 0.002;
        lfo.connect(lg); lg.connect(d.delayTime);
        try { lfo.start(); lfo.stop(ctx.currentTime + 2); } catch(_){}
        const wet = ctx.createGain(); wet.gain.value = fx.flanger * 0.14;
        const mix = ctx.createGain();
        head.connect(mix); head.connect(d); d.connect(wet); wet.connect(mix); head = mix;
      }
      if ((fx.phaser || 0) > 0.05) {
        let n = head;
        for (let i = 0; i < 4; i++) {
          const ap = ctx.createBiquadFilter(); ap.type = 'allpass'; ap.frequency.value = 300 + i * 350;
          n.connect(ap); n = ap;
        }
        const wet = ctx.createGain(); wet.gain.value = fx.phaser * 0.16;
        const mix = ctx.createGain();
        head.connect(mix); n.connect(wet); wet.connect(mix); head = mix;
      }
      if ((fx.trem || 0) > 0.05) {
        const g = ctx.createGain(); g.gain.value = 1 - fx.trem * 0.22;
        const lfo = ctx.createOscillator(); lfo.frequency.value = 4 + fx.trem * 6;
        const lg = ctx.createGain(); lg.gain.value = fx.trem * 0.18;
        lfo.connect(lg); lg.connect(g.gain);
        try { lfo.start(); lfo.stop(ctx.currentTime + 2); } catch(_){}

      }
      if ((fx.delay || 0) > 0.05) {
        const d = ctx.createDelay(0.5); d.delayTime.value = 0.1 + fx.delay * 0.2;
        const fb = ctx.createGain(); fb.gain.value = fx.delayFb || 0.25;
        const wet = ctx.createGain(); wet.gain.value = fx.delay * 0.22;
        d.connect(fb); fb.connect(d);
        const mix = ctx.createGain();
        head.connect(mix); head.connect(d); d.connect(wet); wet.connect(mix); head = mix;
      }
      if (space > 0.02 || (fx.reverb || 0) > 0.05) {

        const d = ctx.createDelay(0.35); d.delayTime.value = 0.12 + amt * 0.08;

        const mix = ctx.createGain();
        head.connect(mix); head.connect(d); d.connect(wg); wg.connect(mix); head = mix;
      }
      if ((fx.width || 0) > 0.05 && ctx.createStereoPanner) {
        const d = ctx.createDelay(0.03); d.delayTime.value = 0.01 * fx.width;
        const wet = ctx.createGain(); wet.gain.value = fx.width * 0.3;
        const mix = ctx.createGain();
        head.connect(mix); head.connect(d); d.connect(wet); wet.connect(mix); head = mix;
      }
      head.connect(dest);
      return input;

    function rollRange(pair, allowZero, zeroChance) {
      if (!pair) return 0;
      if (allowZero && Math.random() < (zeroChance || 0)) return 0;
      const a = pair[0], b = pair[1];
      return a + Math.random() * (b - a);
    }
    function genreFxRack(genre, jitter) {

      jitter = jitter || 0.18;
      function j(pair, zc) {
        let n = rollRange(pair, !!zc, zc || 0);
        n *= (1 - jitter) + Math.random() * jitter * 2;
        return Math.max(0, n);
      }
      return {
        punch: j(spec.punch),
        crush: j(spec.crush, 0.15),
        tone: rollRange(spec.tone),
        space: j(spec.space, 0.08),
        delay: j(spec.delay, 0.2),
        delayFb: j(spec.delayFb),
        chorus: j(spec.chorus, 0.25),
        phaser: j(spec.phaser, 0.3),
        flanger: j(spec.flanger, 0.3),
        reverb: j(spec.reverb, 0.1),
        trem: j(spec.trem, 0.35),

    async function bounceMasterModes(buffer) {
      if (!nightShiftOn && !sleepModeOn) return buffer;
      const ch = buffer.numberOfChannels || 2;
      const extra = Math.ceil(buffer.sampleRate * 0.35);
      const off = new OfflineAudioContext(ch, buffer.length + extra, buffer.sampleRate);
      _modeTap = null;
      const src = off.createBufferSource();
      src.buffer = buffer;
      src.connect(getMasterModeDest(off, off.destination));
      src.start(0);
      return await off.startRendering();
    }

    function getMasterModeDest(ctx, sink) {
      const out = sink || ctx.destination;
      if (!nightShiftOn && !sleepModeOn) return out;
      if (_modeTap && _modeTap.ctx === ctx && _modeTap.ns === nightShiftOn && _modeTap.sm === sleepModeOn && _modeTap.out === out) {
        return _modeTap.input;
      }
      const input = ctx.createGain();
      let node = input;
      if (nightShiftOn) {
        const hp = ctx.createBiquadFilter();
        hp.type = 'highpass';
        hp.frequency.value = 62;
        const lp = ctx.createBiquadFilter();
        lp.type = 'lowpass';
        lp.frequency.value = 8200;
        const dly = ctx.createDelay(0.06);
        dly.delayTime.value = 0.01;
        const lfo = ctx.createOscillator();
        lfo.type = 'sine';
        lfo.frequency.value = 0.17;
        const lg = ctx.createGain();
        lg.gain.value = 0.004;
        lfo.connect(lg);
        lg.connect(dly.delayTime);
        try { lfo.start(); } catch (_) {}
        const tilt = ctx.createBiquadFilter();
        tilt.type = 'peaking';
        tilt.frequency.value = 480;
        tilt.gain.value = 2.2;
        tilt.Q.value = 0.7;
        node.connect(hp);
        hp.connect(dly);
        dly.connect(tilt);
        tilt.connect(lp);
        node = lp;
      }
      if (sleepModeOn) {
        const hp = ctx.createBiquadFilter();
        hp.type = 'highpass';
        hp.frequency.value = 260;
        const mid = ctx.createBiquadFilter();
        mid.type = 'peaking';
        mid.frequency.value = 1350;
        mid.gain.value = 5;
        mid.Q.value = 0.85;
        const lp = ctx.createBiquadFilter();
        lp.type = 'lowpass';
        lp.frequency.value = 3200;
        const g = ctx.createGain();
        g.gain.value = 0.7;
        node.connect(hp);
        hp.connect(mid);
        mid.connect(lp);
        lp.connect(g);
        node = g;
      }
      node.connect(out);
      _modeTap = { ctx: ctx, ns: nightShiftOn, sm: sleepModeOn, out: out, input: input };
      return input;
    }

    async function dreamSaveBlob(blob, filename) {
      try {
        if (!(window.parent && window.parent !== window)) return false;
        if (!blob || !blob.size) return false;
        const buffer = await blob.arrayBuffer();
        const bytes = new Uint8Array(buffer);
        const machine = (document.title || '').split(/[—\-·|]/)[0].trim() || 'MACHINE';
        const fname = filename || (machine + '_' + Date.now() + '.wav');
        return await new Promise((resolve) => {
          const t = setTimeout(() => { window.removeEventListener('message', onMsg); resolve(false); }, 8000);
          function onMsg(e) {
            if (!e.data || e.data.type !== 'DREAM_SAVE_RESULT') return;
            window.removeEventListener('message', onMsg);
            clearTimeout(t);
            resolve(!!e.data.ok);
          }
          window.addEventListener('message', onMsg);
          try {
            window.parent.postMessage({
              type: 'DREAM_SAVE',
              filename: fname,
              buffer: (bytes.buffer.slice(bytes.byteOffset, bytes.byteOffset + bytes.byteLength)), bytes: new Uint8Array(bytes.buffer.slice(bytes.byteOffset, bytes.byteOffset + bytes.byteLength)),
              machine: machine,
              mime: (blob.type || 'audio/wav')
            }, '*');
          } catch (err) {
            clearTimeout(t);
            window.removeEventListener('message', onMsg);
            resolve(false);
          }
        });
      } catch (err) {
        console.warn('dreamSaveBlob', err);
        return false;
      }
    }

          if (e.data.type !== 'DREAM_SAMPLES' && e.data.type !== 'DREAM_ABC_SAMPLES') return;
          window.removeEventListener('message', onMsg);
          clearTimeout(t);
          resolve(e.data.items || []);
        }
        window.addEventListener('message', onMsg);
        try { window.parent.postMessage({ type: 'DREAM_NEED_SAMPLES', folder: folderHint || '' }, '*'); } catch (_) {}
      });
    }


  </script>
</body>
