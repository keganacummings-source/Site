<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>DREAMFI</title>
  <style id="dd-fallback-vars">:root{--bg:#0e0608;--panel:#1a0c12;--panel-2:#12080c;--accent:#c04068;--accent-dim:#7a2844;--accent-bright:#e07090;--accent2:#a02848;--text:#f4e4ea;--text-dim:#9a7884;--dim:#9a7884;--border:#341820;--glow:rgba(192,64,104,.26);--radius:6px}html,body{background-color:var(--bg);color:var(--text)}</style>
<script src="../Themes/sleepwell-theme.js"></script>
  <script src="../Themes/sleepwell-suite.js"></script>
  <script src="../Themes/dreamhost-bridge.js"></script>
  <script id="dd-theme-loader">(function(){
  // If ../Themes/ didn't load (folder renamed / moved), hunt for it in likely places.
  function ok(u){try{var x=new XMLHttpRequest();x.open('HEAD',u,false);x.send();return x.status>=200&&x.status<300}catch(e){return false}}
  var need=[['sleepwell-theme.js',!window.__SW_THEME_LOADED]];
  var dirs=['../Themes/','../../Themes/','Themes/','../DreamSynth/Themes/','../Themes%20/','/Themes/'];
  if(window.__SW_THEME_LOADED)return;
  for(var i=0;i<dirs.length;i++){
    if(ok(dirs[i]+'sleepwell-theme.js')){
      ['sleepwell-theme.js','sleepwell-suite.js','dreamhost-bridge.js'].forEach(function(f){document.write('<script src="'+dirs[i]+f+'"><\/script>')});
      document.write('<link rel="stylesheet" href="'+dirs[i]+'dreamplug.css">');
      break;
    }
  }
})();</script>
</head>
<body>
<style>
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font-family:var(--font,'Segoe UI',system-ui,sans-serif);display:flex;flex-direction:column;overflow:hidden}
.bar{display:flex;gap:6px;align-items:center;padding:8px;border-bottom:1px solid var(--border);background:var(--panel)}
.bar h1{margin:0 8px 0 2px;font-size:1rem;letter-spacing:.1em;color:var(--accent)}
.bar input{flex:1;min-width:0;background:var(--panel-2);color:var(--text);border:1px solid var(--accent-dim);padding:8px 10px;border-radius:var(--radius,4px);font:inherit}
button{background:var(--panel-2);color:var(--text);border:1px solid var(--accent-dim);padding:8px 12px;border-radius:var(--radius,4px);font:inherit;cursor:pointer}
button:hover{border-color:var(--accent-bright)}
button.main{background:var(--accent);color:var(--bg);border-color:var(--accent)}
.tabs{display:flex;gap:6px;padding:6px 8px;border-bottom:1px solid var(--border)}
.tabs button.on{background:var(--accent);color:var(--bg)}
.main{flex:1;min-height:0;display:flex;flex-direction:column;overflow:auto}
#playerWrap{display:none;width:100%;max-width:960px;margin:8px auto 0;padding:0 8px}
#playerBox{position:relative;width:100%;aspect-ratio:16/9;background:#000;border:1px solid var(--accent-dim)}
#playerBox iframe,#playerBox div{position:absolute;inset:0;width:100%;height:100%;border:0}
#now{font-size:.85rem;color:var(--text-dim);padding:6px 0;display:flex;gap:8px;align-items:center;justify-content:space-between}
#now span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#msg{padding:12px;color:var(--text-dim);font-size:.85rem}
#msg a{color:var(--accent-bright)}
#grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px;padding:10px}
.card{border:1px solid var(--border);background:var(--panel);cursor:pointer;border-radius:var(--radius,4px);overflow:hidden}
.card:hover{border-color:var(--accent)}
.card img{width:100%;aspect-ratio:16/9;object-fit:cover;display:block;background:#000}
.card .t{padding:6px 8px;font-size:.78rem;line-height:1.25;max-height:3.9em;overflow:hidden}
.card .c{padding:0 8px 8px;font-size:.68rem;color:var(--text-dim)}
</style>
<div class="bar">
  <h1>DREAMFI</h1>
  <input id="q" placeholder="Search YouTube, or paste a video / playlist link" autocomplete="off">
  <button class="main" id="go">GO</button>
  <button id="key" title="Optional YouTube Data API key for reliable search">KEY</button>
</div>
<div class="tabs"><button data-t="results" class="on">RESULTS</button><button data-t="history">HISTORY</button><button data-t="saved">SAVED</button></div>
<div class="main">
  <div id="playerWrap">
    <div id="playerBox"><div id="yt"></div></div>
    <div id="now"><span id="title"></span><span><button id="save">SAVE +</button> <button id="yt-open">OPEN ON YOUTUBE</button></span></div>
  </div>
  <div id="msg">Search for anything, or paste a YouTube link.</div>
  <div id="grid"></div>
</div>
<script src="https://www.youtube.com/iframe_api"></script>
<script>
(function(){
  var $=function(i){return document.getElementById(i)};
  function ls(k,d){try{var v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}}
  function lw(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
  var hist=ls('dreamfi.hist',[]),saved=ls('dreamfi.saved',[]),apiKey=ls('dreamfi.key',''),tab='results',results=[],cur=null,player=null,ytReady=false,pending=null;
  var PIPED=['https://pipedapi.kavin.rocks','https://pipedapi.adminforge.de','https://api.piped.yt'];
  var INV=['https://inv.nadeko.net','https://yewtu.be','https://invidious.nerdvpn.de'];

  function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
  function parseInput(v){
    v=v.trim();var m;
    if((m=v.match(/[?&]v=([\w-]{11})/))||(m=v.match(/youtu\.be\/([\w-]{11})/))||(m=v.match(/\/(?:embed|shorts|live)\/([\w-]{11})/))) {
      var l=v.match(/[?&]list=([\w-]+)/);return {id:m[1],list:l?l[1]:null};
    }
    var pl=v.match(/[?&]list=([\w-]+)/);if(pl)return {list:pl[1]};
    if(/^[\w-]{11}$/.test(v)&&!/\s/.test(v)&&/[0-9_A-Z-]/.test(v))return {id:v};
    return null;
  }
  function msg(h){$('msg').innerHTML=h;$('msg').style.display=h?'block':'none'}

  window.onYouTubeIframeAPIReady=function(){ytReady=true;if(pending){play(pending.id,pending.title,pending.list);pending=null}};
  function play(id,title,list){
    $('playerWrap').style.display='block';
    if(!ytReady){pending={id:id,title:title,list:list};return}
    cur={id:id,title:title||id};
    $('title').textContent=cur.title;
    var vars={autoplay:1,rel:0,playsinline:1};if(list)vars.list=list,vars.listType='playlist';
    try{
      if(player&&player.loadVideoById&&id&&!list){player.loadVideoById(id)}
      else{
        if(player&&player.destroy)player.destroy();
        $('playerBox').innerHTML='<div id="yt"></div>';
        var o={width:'100%',height:'100%',playerVars:vars,events:{onReady:function(e){try{e.target.playVideo()}catch(x){}}}};
        if(id)o.videoId=id;
        player=new YT.Player('yt',o);
      }
    }catch(e){
      $('playerBox').innerHTML='<iframe allow="autoplay; encrypted-media; fullscreen" allowfullscreen src="https://www.youtube.com/embed/'+(id||'videoseries')+'?autoplay=1&rel=0'+(list?'&list='+list:'')+'"></iframe>';
    }
    if(id){hist=hist.filter(function(h){return h.id!==id});hist.unshift({id:id,title:cur.title,ch:''});hist=hist.slice(0,60);lw('dreamfi.hist',hist)}
    updSave();
    try{$('playerWrap').scrollIntoView({block:'nearest'})}catch(e){}
  }
  function updSave(){$('save').textContent=cur&&saved.some(function(s){return s.id===cur.id})?'SAVED ★':'SAVE +'}

  function draw(){
    var list=tab==='results'?results:tab==='history'?hist:saved,g=$('grid');g.innerHTML='';
    if(!list.length){msg(tab==='results'?'Search for anything, or paste a YouTube link.':'Nothing here yet.');return}
    msg('');
    list.forEach(function(v){
      var d=document.createElement('div');d.className='card';
      d.innerHTML='<img loading="lazy" src="https://i.ytimg.com/vi/'+esc(v.id)+'/mqdefault.jpg" alt=""><div class="t">'+esc(v.title)+'</div><div class="c">'+esc(v.ch||'')+'</div>';
      d.onclick=function(){play(v.id,v.title)};g.appendChild(d);
    });
  }

  async function getJSON(u){var c=new AbortController(),t=setTimeout(function(){c.abort()},7000);try{var r=await fetch(u,{signal:c.signal});if(!r.ok)throw 0;return await r.json()}finally{clearTimeout(t)}}
  async function search(q){
    msg('Searching…');$('grid').innerHTML='';
    var out=null;
    if(apiKey){
      try{
        var j=await getJSON('https://www.googleapis.com/youtube/v3/search?part=snippet&type=video&maxResults=24&q='+encodeURIComponent(q)+'&key='+encodeURIComponent(apiKey));
        out=(j.items||[]).map(function(i){return {id:i.id.videoId,title:i.snippet.title,ch:i.snippet.channelTitle}});
      }catch(e){}
    }
    for(var i=0;!out&&i<PIPED.length;i++){
      try{var j2=await getJSON(PIPED[i]+'/search?q='+encodeURIComponent(q)+'&filter=videos');
        out=(j2.items||[]).filter(function(x){return x.url&&x.url.indexOf('watch?v=')>=0}).map(function(x){return {id:x.url.split('v=')[1].split('&')[0],title:x.title,ch:x.uploaderName}});
        if(!out.length)out=null}catch(e){}
    }
    for(var k=0;!out&&k<INV.length;k++){
      try{var j3=await getJSON(INV[k]+'/api/v1/search?type=video&q='+encodeURIComponent(q));
        out=j3.filter(function(x){return x.videoId}).map(function(x){return {id:x.videoId,title:x.title,ch:x.author}});
        if(!out.length)out=null}catch(e){}
    }
    results=out||[];tab='results';tabs();draw();
    if(!out)msg('Search is unavailable right now (free search relays are down or blocked). Press <b>KEY</b> and add a free YouTube Data API key for reliable search, or <a target="_blank" rel="noopener" href="https://www.youtube.com/results?search_query='+encodeURIComponent(q)+'">search on youtube.com</a> and paste the video link here.');
  }
  function tabs(){document.querySelectorAll('.tabs button').forEach(function(b){b.classList.toggle('on',b.dataset.t===tab)})}
  function go(){
    var v=$('q').value.trim();if(!v)return;
    var p=parseInput(v);
    if(p){play(p.id||null,p.id||'Playlist',p.list);if(p.id)msg('');}
    else search(v);
  }
  $('go').onclick=go;
  $('q').addEventListener('keydown',function(e){if(e.key==='Enter')go();e.stopPropagation()});
  $('q').addEventListener('keyup',function(e){e.stopPropagation()});
  document.querySelectorAll('.tabs button').forEach(function(b){b.onclick=function(){tab=b.dataset.t;tabs();draw()}});
  $('save').onclick=function(){
    if(!cur)return;var i=saved.findIndex(function(s){return s.id===cur.id});
    if(i>=0)saved.splice(i,1);else saved.unshift({id:cur.id,title:cur.title,ch:''});
    lw('dreamfi.saved',saved);updSave();if(tab==='saved')draw();
  };
  $('yt-open').onclick=function(){if(cur)window.open('https://www.youtube.com/watch?v='+cur.id,'_blank','noopener')};
  $('key').onclick=function(){
    var k=prompt('Paste a YouTube Data API v3 key (stored only in this browser). Leave empty to clear.',apiKey||'');
    if(k===null)return;apiKey=k.trim();lw('dreamfi.key',apiKey);
  };
  draw();
})();
</script>
</body>
</html>
