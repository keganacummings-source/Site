  <style>
    :root {
      --bg: #0a0808; --panel: #141010; --accent: #e62020; --text: #f0e8e0;
      --dim:var(--text-dim); --border: #3a2a28; --bezel: #1a1412; --plastic: #2a2220;
      --font: 'Share Tech Mono', ui-monospace, monospace;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: var(--font); background: var(--bg); color: var(--text);
      min-height: 100dvh; display: flex; flex-direction: column; align-items: center; justify-content: flex-start;
      padding: 14px 12px 28px; width: 100%;
      background-image:
        radial-gradient(ellipse 280px 160px at 20% 10%, rgba(180,30,30,0.18), transparent 70%),
        radial-gradient(ellipse 220px 140px at 85% 90%, rgba(60,20,20,0.22), transparent 70%);
    }
    h1 {
      font-family: VT323, monospace; font-size: 2rem; letter-spacing: 0.28em;
      color: var(--accent-bright); text-shadow: 0 0 18px rgba(230,32,32,0.4); text-align: center;
    }
    .sub { font-size: 0.68rem; color: var(--dim); margin-bottom: 12px; text-align: center; letter-spacing: 0.06em; }

    .page-wrap {
      width: 100%;
      max-width: 760px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    /* ---- CRT TV shell ---- */
    .tv-shell {
      width: min(720px, 100%);
      margin-left: auto;
      margin-right: auto;
      background: linear-gradient(165deg, var(--border) 0%, var(--panel) 40%, var(--panel-2) 100%);
      border-radius: 28px 28px 22px 22px;
      padding: 22px 22px 16px;
      box-shadow:
        0 0 0 3px var(--bg),
        0 0 0 6px var(--border),
        0 0 0 8px var(--panel-2),
        0 24px 60px rgba(0,0,0,0.75),
        inset 0 1px 0 rgba(255,255,255,0.08);
      position: relative;
    }
    .tv-shell::before {
      content: '';
      position: absolute; top: 10px; left: 50%; transform: translateX(-50%);
      width: 48px; height: 6px; border-radius: 3px;
      background: var(--bg); box-shadow: inset 0 1px 2px var(--bg);
    }
    .tv-bezel {
      background: var(--bg);
      border-radius: 12px;
      padding: 14px;
      box-shadow:
        inset 0 0 0 2px var(--panel),
        inset 0 0 40px rgba(0,0,0,0.9),
        0 0 0 1px var(--border);
    }
    .tv-screen-wrap {
      position: relative;
      width: 100%;
      aspect-ratio: 4 / 3;
      background: var(--bg);
      border-radius: 6px;
      overflow: hidden;
      box-shadow: inset 0 0 30px rgba(0,0,0,0.85);
    }
    .tv-screen-wrap::after {
      content: '';
      position: absolute; inset: 0; pointer-events: none; z-index: 5;
      background:
        repeating-linear-gradient(0deg, transparent 0 2px, rgba(0,0,0,0.07) 2px 3px),
        radial-gradient(ellipse at center, transparent 55%, rgba(0,0,0,0.35) 100%);
      mix-blend-mode: multiply;
    }
    .screen-layer {
      position: absolute; inset: 0; width: 100%; height: 100%;
      border: 0; background: var(--bg);
    }
    #ytHost, #hlsHost, #staticHost {
      position: absolute; inset: 0; width: 100%; height: 100%;
    }
    #ytHost iframe, #hlsVideo {
      width: 100%; height: 100%; border: 0; display: block;
      pointer-events: none !important;
    }
    /* Block all interaction with the picture */
    .screen-blocker {
      position: absolute; inset: 0; z-index: 10;
      background: transparent; cursor: default;
    }
    #staticCanvas {
      width: 100%; height: 100%; display: block;
      image-rendering: pixelated;
    }
    .ch-badge {
      position: absolute; top: 10px; left: 12px; z-index: 12;
      font-family: VT323, monospace; font-size: 1.35rem; letter-spacing: 0.08em;
      color: var(--accent-bright); text-shadow: 0 0 8px rgba(80,255,100,0.6);
      background: rgba(0,0,0,0.55); padding: 2px 10px; border-radius: 3px;
      pointer-events: none; opacity: 0; transition: opacity 0.25s;
    }
    .ch-badge.show { opacity: 1; }
    .ch-name {
      position: absolute; top: 10px; right: 12px; z-index: 12;
      font-size: 0.62rem; letter-spacing: 0.1em; color: var(--text);
      background: rgba(0,0,0,0.5); padding: 3px 8px; border-radius: 3px;
      pointer-events: none; opacity: 0; transition: opacity 0.25s;
    }
    .ch-name.show { opacity: 1; }

    /* Controls under the tube */
    .tv-controls {
      display: flex; flex-wrap: wrap; gap: 8px; justify-content: center;
      align-items: center; margin-top: 14px; padding: 4px 0 2px;
    }
    .tv-controls button {
      font-family: inherit; font-size: 0.72rem; letter-spacing: 0.04em;
      min-height: 40px; min-width: 52px; padding: 8px 12px;
      border-radius: 8px; border: 1px solid var(--border);
      background: linear-gradient(180deg, var(--border), var(--panel));
      color: var(--text); cursor: pointer;
      box-shadow: 0 2px 0 var(--bg), inset 0 1px 0 rgba(255,255,255,0.06);
    }
    .tv-controls button:hover { background: linear-gradient(180deg, var(--border), var(--panel)); }
    .tv-controls button:active {
      transform: translateY(1px);
      box-shadow: 0 1px 0 var(--bg), inset 0 2px 4px rgba(0,0,0,0.4);
    }
    .tv-controls .pwr {
      background: linear-gradient(180deg, var(--accent-dim), var(--panel));
      border-color: var(--accent); color: var(--text); font-weight: 700;
    }
    .tv-controls .pwr.on {
      background: linear-gradient(180deg, var(--accent), var(--accent));
      box-shadow: 0 0 14px rgba(230,32,32,0.45);
      color: var(--text);
    }
    .vol-readout, .ch-readout {
      font-size: 0.65rem; color: var(--dim); min-width: 56px; text-align: center;
    }
    .speaker-grill {
      display: flex; gap: 3px; justify-content: center; margin-top: 10px;
    }
    .speaker-grill span {
      width: 4px; height: 18px; border-radius: 2px;
      background: var(--bg); box-shadow: inset 0 1px 1px var(--bg);
    }
    .status {
      margin-top: 12px; font-size: 0.65rem; color: var(--dim); text-align: center;
      max-width: 720px; line-height: 1.4;
    }
    .hint {
      margin-top: 6px; font-size: 0.6rem; color: var(--text-dim); text-align: center;
      max-width: 640px; line-height: 1.4;
    }
  </style>

<script id="dreamdaw-ui-bridge">
(function(){
  window.__SW_SKIP_DOWNLOAD=true;
  window._DREAM_SAVE_ONLY=true;
  function isSoundSaveControl(el){
    if(!el||el.nodeType!==1)return false;
    var t=((el.textContent||'')+' '+(el.getAttribute('aria-label')||'')+' '+(el.getAttribute('title')||'')).replace(/\s+/g,' ').trim().toLowerCase();
    return /\b(export|save)\b/.test(t) && /\b(wav|audio|sound|sample|tape|session|one[- ]shot|stem|note|4 bar|8 bar)\b/.test(t);
  }
  function scrub(root){(root||document).querySelectorAll('button,a,[role="button"]').forEach(function(el){if(isSoundSaveControl(el))el.remove();});}
  function bindDrop(input){
    if(!input||input.__dreamDropBound)return; input.__dreamDropBound=true;
    var target=input.closest('label,.dropzone,[data-drop],.slot,.sample-slot,.sample-pad,.track,.lane')||input.parentElement||input;
    ['dragenter','dragover'].forEach(function(ev){target.addEventListener(ev,function(e){if(!e.dataTransfer||!e.dataTransfer.files.length)return;e.preventDefault();e.stopPropagation();target.classList.add('sw-drop-active');},{passive:false});});
    ['dragleave','drop'].forEach(function(ev){target.addEventListener(ev,function(e){if(ev==='drop'&&e.dataTransfer&&e.dataTransfer.files.length){e.preventDefault();e.stopPropagation();try{var dt=new DataTransfer();dt.items.add(e.dataTransfer.files[0]);input.files=dt.files;input.dispatchEvent(new Event('change',{bubbles:true}));}catch(_){}}target.classList.remove('sw-drop-active');},{passive:false});});
  }
  function init(){scrub();document.querySelectorAll('input[type=file]').forEach(bindDrop);}
  document.addEventListener('DOMContentLoaded',init);
  new MutationObserver(function(){scrub();document.querySelectorAll('input[type=file]').forEach(bindDrop);}).observe(document.documentElement,{subtree:true,childList:true});
})();

<script id="dreamdaw-clean-runtime">
(function(){
  'use strict';
  function setKnob(input){
    if(!input||input.type!=='range')return;
    var min=parseFloat(input.min), max=parseFloat(input.max), val=parseFloat(input.value);
    if(!isFinite(min))min=0;if(!isFinite(max)||max<=min)max=100;if(!isFinite(val))val=min;
    var p=Math.max(0,Math.min(75,(val-min)/(max-min)*75));
    input.style.setProperty('--knob-p',p.toFixed(2));
    var wrap=input.parentElement&&input.parentElement.classList.contains('knob-wrap')?input.parentElement:null;
    if(wrap){var v=wrap.querySelector('.knob-value');if(v)v.textContent=(Math.abs(val)>=100?Math.round(val):Number(val.toFixed(2)));}
  }
  function enhance(root){
    (root||document).querySelectorAll('input[type=range]').forEach(function(input){
      if(input.dataset.dreamKnob==='1'){setKnob(input);return;}
      input.dataset.dreamKnob='1';
      var parent=input.parentElement;
      if(parent && parent.classList.contains('knob-wrap')){setKnob(input);return;}
      var wrap=document.createElement('span');wrap.className='knob-wrap';
      input.replaceWith(wrap);wrap.appendChild(input);
      var value=document.createElement('span');value.className='knob-value';wrap.appendChild(value);
      input.addEventListener('input',function(){setKnob(input)},{passive:true});
      input.addEventListener('change',function(){setKnob(input)},{passive:true});
      setKnob(input);
    });
  }
  function cleanLearning(){
    document.querySelectorAll('.learn-btn,.learn-dock,#learnBtn,#learnBtnB,#learnDock').forEach(function(el){el.setAttribute('aria-hidden','true');});
  }
  function requestFit(){
    try{
      var r=document.documentElement.getBoundingClientRect();
      var w=Math.max(420,Math.ceil(r.width||document.body.scrollWidth||0));
      var h=Math.max(260,Math.ceil(r.height||document.body.scrollHeight||0));
      if(window.__JUCE__&&window.__JUCE__.backend){
        try{window.__JUCE__.backend.emitEvent('requestResize',{width:w,height:h});}catch(_){ }
        try{window.__JUCE__.backend.emitEvent('setSize',{width:w,height:h});}catch(_){ }
      }
      try{window.parent.postMessage({type:'DREAMDAW_RESIZE',width:w,height:h},'*');}catch(_){ }
    }catch(_){ }
  }

  function fitToHost(){
    try{
      var app=document.querySelector('.app,.machine,.machine-shell'); if(!app) return;
      app.style.zoom='1';
      var aw=document.documentElement.clientWidth||window.innerWidth;
      var ah=document.documentElement.clientHeight||window.innerHeight;
      var sw=Math.max(app.scrollWidth,app.getBoundingClientRect().width);
      var sh=Math.max(app.scrollHeight,app.getBoundingClientRect().height);
      var scale=Math.min(1,(aw-4)/Math.max(1,sw),(ah-4)/Math.max(1,sh));
      if(scale<0.995) app.style.zoom=Math.max(.68,scale.toFixed(3));
      requestFit();
    }catch(_){}
  }

  function init(){enhance();cleanLearning();requestFit();fitToHost();setTimeout(requestFit,80);setTimeout(fitToHost,120);setTimeout(requestFit,300);}
  if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',init);else init();
  new MutationObserver(function(){enhance();cleanLearning();}).observe(document.documentElement,{subtree:true,childList:true});
  window.addEventListener('resize',requestFit,{passive:true});
})();
</script>

<body>
<div class="page-wrap">
  <h1>DREAMFI</h1>
  <p class="sub">late-night channels · view only · do not trust the guide</p>

  <div class="tv-shell" id="tvShell">

      <div class="tv-screen-wrap" id="screenWrap">
        <div id="ytHost" class="screen-layer" style="display:none"></div>

        </div>
        <div id="staticHost" class="screen-layer" style="display:none">
          <canvas id="staticCanvas"></canvas>
        </div>
        <div class="screen-blocker" id="screenBlocker" title=""></div>

    </div>

      <button type="button" id="volUpBtn" title="Volume up">VOL +</button>
      <span class="vol-readout" id="volReadout">VOL 60</span>
    </div>
    <div class="speaker-grill" aria-hidden="true">
      <span></span><span></span><span></span><span></span><span></span>
      <span></span><span></span><span></span><span></span><span></span>
      <span></span><span></span><span></span><span></span><span></span>
    </div>
  </div>

  <div class="status" id="status">Power on to tune in.</div>
  <p class="hint">Screen is view-only — no clicks on the picture. CH ± flips channels · VOL ± sets loudness · when a tape ends, another random one loads.</p>

  // Extra known Channel 5–style longform IDs as fallbacks (rotated randomly)
  const C5_VIDEOS = [
    // playlist is primary; these are last-resort single embeds if playlist fails
  ];

  // CH2 Toonami Aftermath — live HLS (site channel map: EST feed ≈ their CH19 lineup feed)
  // Prefer HTTPS; fall back to HTTP and delayed variants if the primary fails.
  const TA_STREAMS = [
    'https://api.toonamiaftermath.com:3000/est/playlist.m3u8?useHttps=true',
    'https://api.toonamiaftermath.com:3000/est/playlist.m3u8',
    'https://api.toonamiaftermath.com:3000/est/playlist.m3u8?streamDelay=0&useHttps=true',
    'http://api.toonamiaftermath.com:3000/est/playlist.m3u8?useHttps=true',
    'http://api.toonamiaftermath.com:3000/est/playlist.m3u8',
    'https://api.toonamiaftermath.com:3000/pst/playlist.m3u8?useHttps=true',
    'http://api.toonamiaftermath.com:3000/pst/playlist.m3u8'
  ];

  const CHANNELS = [
    { n: 1, name: 'MORPH', type: 'yt-pr' },
    { n: 2, name: 'TOONAMI', type: 'yt-toonami' },
    { n: 3, name: 'SNOW', type: 'static' },
    { n: 4, name: 'FIVE', type: 'yt-c5' }
  ];

  let powerOn = false;
  let channelIdx = 0;
  let volume = 60; // 0–100
  let ytPlayer = null;
  let ytReady = false;
  let hls = null;
  let staticAnim = null;
  let badgeTimer = null;

  const statusEl = document.getElementById('status');
  const chBadge = document.getElementById('chBadge');
  const chName = document.getElementById('chName');
  const chReadout = document.getElementById('chReadout');
  const volReadout = document.getElementById('volReadout');
  const pwrBtn = document.getElementById('pwrBtn');
  const ytHost = document.getElementById('ytHost');
  const hlsHost = document.getElementById('hlsHost');
  const staticHost = document.getElementById('staticHost');
  const hlsVideo = document.getElementById('hlsVideo');
  const staticCanvas = document.getElementById('staticCanvas');

  function setStatus(msg) { statusEl.textContent = msg || ''; }

  function showBadge() {
    const ch = CHANNELS[channelIdx];
    chBadge.textContent = 'CH ' + String(ch.n).padStart(2, '0');
    chName.textContent = ch.name;
    chBadge.classList.add('show');
    chName.classList.add('show');
    clearTimeout(badgeTimer);
    badgeTimer = setTimeout(() => {
      chBadge.classList.remove('show');
      chName.classList.remove('show');
    }, 2200);
  }

  function updateReadouts() {
    const ch = CHANNELS[channelIdx];
    chReadout.textContent = 'CH ' + String(ch.n).padStart(2, '0');
    volReadout.textContent = 'VOL ' + volume;
  }

  function hideAllLayers() {
    ytHost.style.display = 'none';
    hlsHost.style.display = 'none';
    staticHost.style.display = 'none';
    stopStatic();
    stopHls();
  }

  // ---- Static (CH3) ----
  function stopStatic() {
    if (staticAnim) { cancelAnimationFrame(staticAnim); staticAnim = null; }
  }
  function startStatic() {
    stopStatic();
    staticHost.style.display = 'block';
    const ctx = staticCanvas.getContext('2d', { alpha: false });
    const w = staticCanvas.width = staticCanvas.clientWidth || 640;
    const h = staticCanvas.height = staticCanvas.clientHeight || 480;
    const img = ctx.createImageData(w, h);
    const data = img.data;
    function frame() {
      for (let i = 0; i < data.length; i += 4) {
        const v = (Math.random() * 255) | 0;
        data[i] = data[i + 1] = data[i + 2] = v;
        data[i + 3] = 255;
      }
      ctx.putImageData(img, 0, 0);
      staticAnim = requestAnimationFrame(frame);
    }
    frame();
    // Soft static hiss via Web Audio (optional, volume-linked)
    ensureStaticAudio();
  }

  let staticAudio = null;
  function ensureStaticAudio() {
    try {
      if (!staticAudio) {
        const ac = new (window.AudioContext || window.webkitAudioContext)();
        const bufSize = 2 * ac.sampleRate;
        const buf = ac.createBuffer(1, bufSize, ac.sampleRate);
        const d = buf.getChannelData(0);
        for (let i = 0; i < bufSize; i++) d[i] = Math.random() * 2 - 1;
        const src = ac.createBufferSource();
        src.buffer = buf; src.loop = true;
        const g = ac.createGain();
        g.gain.value = (volume / 100) * 0.08;
        src.connect(g); g.connect(ac.destination);
        src.start();
        staticAudio = { ac, src, g };
      } else {
        staticAudio.g.gain.value = (volume / 100) * 0.08;
        if (staticAudio.ac.state === 'suspended') staticAudio.ac.resume();
      }
    } catch (_) {}
  }
  function stopStaticAudio() {
    if (staticAudio) {
      try { staticAudio.src.stop(); } catch (_) {}
      try { staticAudio.ac.close(); } catch (_) {}
      staticAudio = null;
    }
  }

  // ---- HLS / Toonami (CH2) ----
  function stopHls() {
    try { if (hls) { hls.destroy(); hls = null; } } catch (_) {}
    try { hlsVideo.pause(); hlsVideo.removeAttribute('src'); hlsVideo.load(); } catch (_) {}
  }
  function startHls() {
    stopHls();
    hlsHost.style.display = 'block';
    hlsVideo.muted = true; // start muted for autoplay policy, unmute after gesture/play
    hlsVideo.volume = Math.max(0, Math.min(1, volume / 100));
    let attempt = 0;
    const tryPlay = (u) => {
      setStatus('Tuning CH 02 · Toonami Aftermath…');
      if (window.Hls && Hls.isSupported()) {
        try { if (hls) hls.destroy(); } catch (_) {}
        hls = new Hls({
          enableWorker: true,
          lowLatencyMode: true,
          backBufferLength: 30,
          maxBufferLength: 20,
          xhrSetup: function (xhr) {
            try { xhr.withCredentials = false; } catch (_) {}
          }
        });
        hls.loadSource(u);
        hls.attachMedia(hlsVideo);
        hls.on(Hls.Events.MANIFEST_PARSED, () => {
          const p = hlsVideo.play();
          if (p && p.then) {
            p.then(() => {
              applyHlsVolume();
              setStatus('CH 02 · Toonami Aftermath live (site feed) · view only');
            }).catch(() => {
              setStatus('Picture ready — tap PWR or VOL + if silent (browser autoplay).');
              applyHlsVolume();
            });
          } else {
            applyHlsVolume();
            setStatus('CH 02 · Toonami Aftermath live · view only');
          }
        });
        hls.on(Hls.Events.ERROR, (_, data) => {
          if (data && data.fatal) {
            try { hls.destroy(); } catch (_) {}
            hls = null;
            attempt++;
            if (attempt < TA_STREAMS.length) {
              setStatus('Midnight stream retry ' + (attempt + 1) + '/' + TA_STREAMS.length + '…');
              setTimeout(() => tryPlay(TA_STREAMS[attempt]), 400);
            } else {
              setStatus('Midnight feed offline — try CH − / CH + later, or check network');
            }
          }
        });
      } else if (hlsVideo.canPlayType('application/vnd.apple.mpegurl')) {
        hlsVideo.src = u;
        hlsVideo.play().then(() => applyHlsVolume()).catch(() => applyHlsVolume());
        setStatus('CH 02 · Toonami Aftermath live · view only');
        setTimeout(applyHlsVolume, 400);
      } else {
        setStatus('This browser cannot play the live HLS feed.');
      }
    };
    tryPlay(TA_STREAMS[0]);
  }

  // ---- YouTube ----
  function destroyYt() {
    try { if (ytPlayer && ytPlayer.destroy) ytPlayer.destroy(); } catch (_) {}
    ytPlayer = null;
    ytHost.innerHTML = '';
  }

  let wantSound = false;
  function ytVolume() {
    if (!ytPlayer || typeof ytPlayer.setVolume !== 'function') return;
    try {
      if (!wantSound || volume <= 0) { ytPlayer.mute(); return; }
      ytPlayer.setVolume(volume);
      ytPlayer.unMute();
    } catch (_) {}
  }

  function loadYtPlaylist(listId, fallbackIds, label) {
    destroyYt();
    ytHost.style.display = 'block';
    const hostId = 'ytFrame_' + Date.now();
    const div = document.createElement('div');
    div.id = hostId;
    ytHost.appendChild(div);

    const startIndex = Math.floor(Math.random() * 40); // random-ish start in playlist
    const onReady = (ev) => {
      ytPlayer = ev.target;
      ytVolume();
      try {
        // Shuffle-like: jump to a random index if playlist loaded
        const count = ytPlayer.getPlaylistId ? 1 : 1;
        try { ytPlayer.setShuffle(true); } catch (_) {}
        try { ytPlayer.playVideo(); } catch (_) {}
      } catch (_) {}
      setStatus(label);
    };
    const onState = (ev) => {
      // 0 = ended → load another random
      if (ev.data === 0) {
        setTimeout(() => tuneChannel(true), 400);
      }
    };
    const onError = () => {
      // Fallback single video
      const id = fallbackIds[Math.floor(Math.random() * fallbackIds.length)];
      try {
        ytPlayer.loadVideoById({ videoId: id, startSeconds: 0 });
        ytVolume();
      } catch (_) {
        setStatus('Signal weak — flipping…');
        setTimeout(() => tuneChannel(true), 1200);
      }
    };

    if (typeof YT === 'undefined' || !YT.Player) {
      // API not ready — inject plain embed as fallback
      ytHost.innerHTML = '';
      const ifr = document.createElement('iframe');
      ifr.allow = 'autoplay; encrypted-media';
      ifr.referrerPolicy = 'strict-origin-when-cross-origin';
      ifr.src = 'https://www.youtube.com/embed/videoseries?list=' + encodeURIComponent(listId) +
        '&autoplay=1&mute=1&controls=0&disablekb=1&fs=0&modestbranding=1&rel=0&iv_load_policy=3&playsinline=1';
      ifr.setAttribute('pointer-events', 'none');
      ytHost.appendChild(ifr);
      setStatus(label + ' · embed');
      // Poll end poorly — reload playlist randomly every ~22 min as soft rotate
      setTimeout(() => { if (powerOn && CHANNELS[channelIdx].type.indexOf('yt') === 0) tuneChannel(true); }, 22 * 60 * 1000);
      return;
    }

    ytPlayer = new YT.Player(hostId, {
      width: '100%',
      height: '100%',
      playerVars: {
        listType: 'playlist',
        list: listId,
        index: startIndex,
        autoplay: 1,
        mute: 1,
        controls: 0,
        disablekb: 1,
        fs: 0,
        modestbranding: 1,
        rel: 0,
        iv_load_policy: 3,
        playsinline: 1,
        origin: location.origin
      },
      events: {
        onReady: onReady,
        onStateChange: onState,
        onError: onError
      }
    });
  }

  function loadYtRandomVideo(ids, label) {
    destroyYt();
    ytHost.style.display = 'block';
    const id = ids[Math.floor(Math.random() * ids.length)];
    const hostId = 'ytVid_' + Date.now();
    const div = document.createElement('div');
    div.id = hostId;
    ytHost.appendChild(div);

    if (typeof YT === 'undefined' || !YT.Player) {
      const ifr = document.createElement('iframe');
      ifr.allow = 'autoplay; encrypted-media';
      ifr.src = 'https://www.youtube.com/embed/' + id +
        '?autoplay=1&controls=0&disablekb=1&fs=0&modestbranding=1&rel=0&iv_load_policy=3&playsinline=1';
      ytHost.innerHTML = '';
      ytHost.appendChild(ifr);
      setStatus(label);
      return;
    }
    ytPlayer = new YT.Player(hostId, {
      videoId: id,
      width: '100%',
      height: '100%',
      playerVars: {
        autoplay: 1, controls: 0, disablekb: 1, fs: 0,
        modestbranding: 1, rel: 0, iv_load_policy: 3, playsinline: 1
      },
      events: {
        onReady: (ev) => { ytPlayer = ev.target; ytVolume(); try { ytPlayer.playVideo(); } catch (_) {} setStatus(label); },
        onStateChange: (ev) => { if (ev.data === 0) setTimeout(() => tuneChannel(true), 400); },
        onError: () => setTimeout(() => tuneChannel(true), 800)
      }
    });
  }

  function tuneChannel(forceReload) {
    if (!powerOn) return;
    stopStaticAudio();
    hideAllLayers();
    const ch = CHANNELS[channelIdx];
    updateReadouts();
    showBadge();

    if (ch.type === 'static') {
      startStatic();
      setStatus('CH 03 · snow');
      return;
    }
    if (ch.type === 'hls-ta' || ch.type === 'yt-toonami') {
      // Official adult swim Toonami uploads. Aftermath HLS is CORS-blocked inside the browser.
      loadYtPlaylist('PLQl8zBB7bPvIoSw-exyj3yIiDH7p8SYNP', ['gyot6uTEtsU'], 'CH 02 · Toonami');
      return;
    }
    if (ch.type === 'yt-pr') {
      const list = PR_PLAYLISTS[Math.floor(Math.random() * PR_PLAYLISTS.length)];
      loadYtPlaylist(list, PR_VIDEOS, 'CH 01 · random episode');
      return;
    }
    if (ch.type === 'yt-c5') {
      loadYtPlaylist(C5_UPLOADS, C5_VIDEOS.concat(PR_VIDEOS.slice(0, 3)), 'CH 04 · random tape');
      return;
    }
  }

  function setPower(on, fromGesture) {
    powerOn = on;
    pwrBtn.classList.toggle('on', on);
    pwrBtn.textContent = on ? 'PWR' : 'PWR';
    if (!on) {
      hideAllLayers();
      destroyYt();
      stopHls();
      stopStaticAudio();
      setStatus('Standby.');
      return;
    }
    setStatus('Warming up the tube…');
    tuneChannel(true);
    if (fromGesture) { wantSound = true; setTimeout(ytVolume, 800); }
  }

  function changeChannel(delta) {
    if (!powerOn) { setStatus('Power is off.'); return; }
    channelIdx = (channelIdx + delta + CHANNELS.length) % CHANNELS.length;
    tuneChannel(true);
  }

  function changeVolume(delta) {
    volume = Math.max(0, Math.min(100, volume + delta));
    wantSound = volume > 0;
    updateReadouts();
    ytVolume();
    try {
      applyHlsVolume();
    } catch (_) {
      try {
        hlsVideo.volume = volume / 100;
        hlsVideo.muted = volume <= 0;
      } catch (_) {}
    }
    if (staticAudio && staticAudio.g) {
      staticAudio.g.gain.value = (volume / 100) * 0.08;
    }
  }

  // Buttons
  pwrBtn.addEventListener('click', () => setPower(!powerOn, true));
  document.getElementById('chUpBtn').addEventListener('click', () => changeChannel(1));
  document.getElementById('chDownBtn').addEventListener('click', () => changeChannel(-1));
  document.getElementById('volUpBtn').addEventListener('click', () => changeVolume(5));
  document.getElementById('volDownBtn').addEventListener('click', () => changeVolume(-5));

  // Block context menu / drag on screen
  document.getElementById('screenBlocker').addEventListener('contextmenu', e => e.preventDefault());
  document.getElementById('screenBlocker').addEventListener('click', e => e.preventDefault());

  // YouTube API ready
  window.onYouTubeIframeAPIReady = function () {
    ytReady = true;
    if (powerOn) tuneChannel(true);
  };
  // If API already present
  if (typeof YT !== 'undefined' && YT.Player) {
    ytReady = true;
  }

  updateReadouts();
  // Auto power-on shortly after open so the TV appears "on"
  setTimeout(() => setPower(true), 350);

  // Theme bridge
  window.addEventListener('message', function (e) {
    const d = e.data;
    if (!d) return;
    if (d.type === 'DREAM_THEME' && d.theme && window.SleepwellTheme) {
      try { SleepwellTheme.apply(d.theme); } catch (_) {}
    }
  });
  try {
    if (window.parent && window.parent !== window) {
      window.parent.postMessage({ type: 'DREAM_THEME_REQUEST' }, '*');
    }
  } catch (_) {}
})();
</script>
</div>
</body>
</html>
