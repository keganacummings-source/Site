<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
  <title>DREAMDAW — Plugin Selector</title>
  <script src="Themes/sleepwell-theme.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=VT323&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0e0608;
      --panel: #1a0c12;
      --accent: #c04068;
      --accent-dim: #7a2844;
      --accent-bright: #e07090;
      --text: #f4e4ea;
      --text-dim: #9a7884;
      --border: #341820;
      --radius: 8px;
      --font: 'Share Tech Mono', ui-monospace, monospace;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { min-height: 100%; }
    body {
      font-family: var(--font);
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px 14px 40px;
      background-image:
        radial-gradient(ellipse 48% 28% at 6% -6%, rgba(192,64,104,0.28), transparent 62%),
        radial-gradient(ellipse 36% 24% at 100% 0%, rgba(90,20,48,0.4), transparent 58%),
        linear-gradient(180deg, #1a0a10, #0e0608 42%, #070305);
    }
    header {
      width: 100%;
      max-width: 1100px;
      text-align: center;
      margin-bottom: 18px;
    }
    h1 {
      font-family: 'VT323', var(--font);
      font-size: 2.4rem;
      letter-spacing: 0.2em;
      font-weight: 400;
      text-shadow: 0 0 24px rgba(192,64,104,0.45);
    }
    .subtitle {
      color: var(--text-dim);
      font-size: 0.78rem;
      letter-spacing: 0.04em;
      margin-top: 4px;
      line-height: 1.45;
    }
    .top-bar {
      width: 100%;
      max-width: 1100px;
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 14px;
    }
    .login-row {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
    }
    .login-row input {
      background: var(--panel);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 8px 10px;
      font-family: inherit;
      font-size: 0.78rem;
      min-width: 110px;
    }
    button, .btn {
      font-family: inherit;
      font-size: 0.78rem;
      font-weight: 600;
      padding: 8px 14px;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      transition: background 0.15s, box-shadow 0.15s;
    }
    .btn-primary {
      background: var(--accent);
      color: #fff;
    }
    .btn-primary:hover { background: var(--accent-bright); }
    .btn-secondary {
      background: #1a1014;
      color: var(--text);
      border: 1px solid var(--border);
    }
    .btn-secondary:hover { background: #241820; }
    #who {
      color: var(--text-dim);
      font-size: 0.72rem;
    }
    #err {
      color: var(--accent-bright);
      font-size: 0.72rem;
      width: 100%;
    }
    .vst-box {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 12px 14px;
      max-width: 320px;
      font-size: 0.72rem;
      color: var(--text-dim);
      line-height: 1.4;
    }
    .vst-box strong { color: var(--text); display: block; margin-bottom: 6px; letter-spacing: 0.06em; }
    .vst-toggle {
      display: flex;
      gap: 0;
      margin: 8px 0;
      border-radius: 6px;
      overflow: hidden;
      border: 1px solid var(--border);
    }
    .vst-toggle button {
      flex: 1;
      border-radius: 0;
      background: #12080c;
      color: var(--text-dim);
      border: none;
      padding: 7px 10px;
    }
    .vst-toggle button.on {
      background: var(--accent);
      color: #fff;
    }
    .shell {
      width: 100%;
      max-width: 1100px;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 12px;
      box-shadow: 0 0 0 1px #000, 0 16px 48px rgba(0,0,0,0.55), 0 0 28px rgba(192,64,104,0.12);
      overflow: hidden;
    }
    .toolbar {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      padding: 12px 14px;
      background: #12080c;
      border-bottom: 1px solid var(--border);
      align-items: center;
    }
    #find {
      flex: 1;
      min-width: 140px;
      background: #1a0c12;
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 8px 10px;
      font-family: inherit;
      font-size: 0.78rem;
    }
    .filters {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }
    .filters button {
      background: #1a1014;
      color: var(--text-dim);
      border: 1px solid var(--border);
      padding: 6px 10px;
      font-size: 0.7rem;
    }
    .filters button.on {
      background: var(--accent-dim);
      color: #fff;
      border-color: var(--accent);
    }
    .body { padding: 14px; }
    .section-title {
      font-size: 0.65rem;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--text-dim);
      margin-bottom: 10px;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
      gap: 10px;
      min-height: 120px;
    }
    .card {
      background: #12080c;
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      text-align: left;
      transition: border-color 0.15s, box-shadow 0.15s;
    }
    .card:hover {
      border-color: var(--accent-dim);
      box-shadow: 0 0 16px rgba(192,64,104,0.18);
    }
    .card.beta {
      border-color: #3a2a10;
      background: linear-gradient(160deg, #12100a 0%, #12080c 100%);
    }
    .card .name {
      font-size: 0.88rem;
      font-weight: 700;
      letter-spacing: 0.03em;
    }
    .card .tag {
      font-size: 0.58rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--accent-bright);
      opacity: 0.85;
    }
    .card .file {
      font-size: 0.62rem;
      color: var(--text-dim);
      word-break: break-all;
    }
    .card .blurb {
      font-size: 0.68rem;
      color: var(--text-dim);
      line-height: 1.35;
      flex: 1;
    }
    .card .launch {
      margin-top: 6px;
      width: 100%;
      background: var(--accent);
      color: #fff;
      border: none;
      border-radius: 6px;
      padding: 9px 12px;
      font-family: inherit;
      font-weight: 700;
      cursor: pointer;
    }
    .card .launch:hover { background: var(--accent-bright); }
    .empty {
      grid-column: 1 / -1;
      text-align: center;
      padding: 32px 16px;
      color: var(--text-dim);
      font-size: 0.85rem;
    }
    .status {
      padding: 10px 14px;
      font-size: 0.7rem;
      color: var(--text-dim);
      border-top: 1px solid var(--border);
      background: #0a0608;
    }
    @media (max-width: 640px) {
      h1 { font-size: 1.8rem; }
      .vst-box { max-width: 100%; width: 100%; }
    }
  </style>
</head>
<body>
  <header>
    <h1>DREAMDAW</h1>
    <p class="subtitle">Plugin selector · log in · launch a machine · Homescreen returns here</p>
  </header>

  <div class="top-bar">
    <form class="login-row" id="loginForm">
      <input id="user" placeholder="user" autocomplete="username">
      <input id="pass" placeholder="pass" type="password" autocomplete="current-password">
      <button type="submit" class="btn-primary">Log in</button>
      <span id="who">signed out</span>
      <span id="err"></span>
    </form>
    <div class="vst-box">
      <strong>VST3 DOWNLOADS</strong>
      Unzip and place the plugin folder in your DAW’s VST3 folder.
      <div class="vst-toggle" role="group" aria-label="Choose VST package">
        <button type="button" id="vstMasterBtn">Master</button>
        <button type="button" id="vstShareBtn" class="on">Share</button>
      </div>
      <button type="button" class="btn-primary" id="vstDownloadGo" style="width:100%">Download Share VST</button>
      <div id="vstDownloadStatus" style="margin-top:6px">DreamShare VST3 package.</div>
    </div>
  </div>

  <div class="shell">
    <div class="toolbar">
      <input id="find" type="search" placeholder="Search machines…" aria-label="Search machines">
      <div class="filters" id="filters">
        <button type="button" data-filter="all" class="on">All</button>
        <button type="button" data-filter="keys">Keys</button>
        <button type="button" data-filter="drums">Drums</button>
        <button type="button" data-filter="strings">Strings</button>
        <button type="button" data-filter="fx">FX</button>
        <button type="button" data-filter="voice">Voice</button>
        <button type="button" data-filter="tools">Tools</button>
        <button type="button" data-filter="beta">Beta</button>
      </div>
    </div>
    <div class="body">
      <p class="section-title">Machines · <span id="count">0</span> showing</p>
      <div class="grid" id="grid"><div class="empty">Loading library…</div></div>
    </div>
    <div class="status" id="status">Ready · no DreamBuilder · plugin selector only</div>
  </div>

  <script>
(function () {
  const API = "https://dreamshare-api.keganacummings.workers.dev/";
  const BLURBS = {
    DREAMFOG: { tag: "FOG", fam: "fx", blurb: "Drift, hiss, and distance on a tape." },
    DREAMABC: { tag: "PIANO ROLL", fam: "tools", blurb: "Pocket roll, chords, and MIDI you can drop on a lane." },
    DREAMAXE: { tag: "GUITAR", fam: "strings", blurb: "Crying electric. Every machine frame follows this border." },
    DREAMBASS: { tag: "BASS", fam: "keys", blurb: "Low end — sub, growl, and pocket." },
    DREAMCHPPA: { tag: "CHOPS", fam: "drums", blurb: "Chop a tape into a rhythm you can replay." },
    DREAMDRDRUM: { tag: "DRUMS", fam: "drums", blurb: "Kit machine wired to the package drum library." },
    DREAMGLITCR: { tag: "GLITCH", fam: "fx", blurb: "Stutter a loop until it breaks." },
    DREAMMIRROR: { tag: "MIRROR", fam: "fx", blurb: "Reflect a sound against itself." },
    DREAMORACLE: { tag: "ORACLE", fam: "fx", blurb: "Air, grit, and the tower tone." },
    DREAMPARASITE: { tag: "PARASITE", fam: "fx", blurb: "Infection echoes and crawling tails." },
    DREAMRECORDER: { tag: "RECORDER", fam: "tools", blurb: "Mic in, print a take into the session." },
    DREAMSHARE: { tag: "SHARE", fam: "tools", blurb: "Hand a tape to another room on the same network." },
    DREAMSHARELITE: { tag: "SHARE LITE", fam: "tools", blurb: "Threads, comments, and live chat — same login as GOODNIGHT." },
    DREAMSSYYNNTTHH: { tag: "SYNTH", fam: "keys", blurb: "The big synth. Stack tones and print a stem." },
    DREAMSTRYNG: { tag: "STRINGS", fam: "strings", blurb: "Bowed and plucked string tones." },
    DREAMFI: { tag: "LO-FI", fam: "fx", blurb: "Crush and late-night radio color." },
    DREAMDRAW: { tag: "DRAW", fam: "tools", blurb: "Draw shapes into tone." },
    DREAMLEAD: { tag: "LEAD", fam: "keys", blurb: "Cutting lead voice." },
    DREAMPAD: { tag: "PAD", fam: "keys", blurb: "Wide held pads." },
    DREAMARP: { tag: "ARP", fam: "keys", blurb: "Arpeggiated patterns." },
    DREAM3XOSC: { tag: "3X OSC", fam: "keys", blurb: "Three oscillators, one voice." },
    DREAMSINE: { tag: "SINE", fam: "keys", blurb: "Clean sine instrument." },
    DREAMSAW: { tag: "SAW", fam: "keys", blurb: "Sawtooth lead / bass." },
    DREAMPULSE: { tag: "PULSE", fam: "keys", blurb: "Pulse width tones." },
    DREAMSUB: { tag: "SUB", fam: "keys", blurb: "Sub-bass body." },
    DREAMANALOG: { tag: "ANALOG", fam: "keys", blurb: "Analog-style stack." },
    DREAMKEYS: { tag: "KEYS", fam: "keys", blurb: "Keyboard voice." },
    DREAMORGAN: { tag: "ORGAN", fam: "keys", blurb: "Drawbar-style organ." },
    DREAMPLUCK: { tag: "PLUCK", fam: "strings", blurb: "Plucked attacks." },
    DREAMBELL: { tag: "BELL", fam: "keys", blurb: "Metallic bells." },
    DREAMBRASS: { tag: "BRASS", fam: "keys", blurb: "Brass section color." },
    DREAMFLUTE: { tag: "FLUTE", fam: "voice", blurb: "Airy flute tone." },
    DREAMCHOIR: { tag: "CHOIR", fam: "voice", blurb: "Choral stack." },
    DREAMMARIMBA: { tag: "MARIMBA", fam: "keys", blurb: "Wooden bar hits." },
    DREAMCLAV: { tag: "CLAV", fam: "keys", blurb: "Clavinet bite." },
    DREAMHORN: { tag: "HORN", fam: "keys", blurb: "Horn stabs." },
    DREAMCHORD: { tag: "CHORD", fam: "keys", blurb: "Held chord machine." },
    DREAMMONO: { tag: "MONO", fam: "keys", blurb: "Monophonic lead." },
    DREAMARPBOX: { tag: "ARP BOX", fam: "keys", blurb: "Boxed arpeggiator." },
    DREAMDRONE: { tag: "DRONE", fam: "fx", blurb: "Long drones." },
    DREAMNOISE: { tag: "NOISE", fam: "fx", blurb: "Noise textures." },
    DREAMTOY: { tag: "TOY", fam: "keys", blurb: "Toy keyboard character." },
    DREAMRACK: { tag: "RACK", fam: "fx", blurb: "Effect rack utilities." }
  };

  let allPlugins = [];
  let filter = "all";
  let query = "";

  function isBeta(p) {
    const f = (p.fileName || p.file || "").toLowerCase();
    return f.indexOf("beta") === 0 || !!p.beta;
  }

  function famOf(p) {
    const meta = BLURBS[p.name] || {};
    return meta.fam || "tools";
  }

  function render() {
    const grid = document.getElementById("grid");
    const q = query.trim().toLowerCase();
    const list = allPlugins.filter(function (p) {
      const name = (p.name || "").toLowerCase();
      const file = (p.fileName || p.file || "").toLowerCase();
      if (q && name.indexOf(q) < 0 && file.indexOf(q) < 0) return false;
      if (filter === "all") return true;
      if (filter === "beta") return isBeta(p);
      return famOf(p) === filter;
    });
    document.getElementById("count").textContent = String(list.length);
    if (!list.length) {
      grid.innerHTML = '<div class="empty">No machines match.</div>';
      return;
    }
    grid.innerHTML = "";
    list.forEach(function (p) {
      const name = p.name || "unnamed";
      const file = p.fileName || p.file || "";
      const rel = p.url || ("Pluggins Folder/" + file);
      const meta = BLURBS[name] || {};
      const card = document.createElement("div");
      card.className = "card" + (isBeta(p) ? " beta" : "");
      card.innerHTML =
        '<div class="tag">' + (meta.tag || (isBeta(p) ? "BETA" : "MACHINE")) + "</div>" +
        '<div class="name">' + name + "</div>" +
        '<div class="file">' + file + "</div>" +
        '<div class="blurb">' + (meta.blurb || "Open this machine.") + "</div>" +
        '<button type="button" class="launch">Launch</button>';
      card.querySelector(".launch").onclick = function () {
        const url = String(rel).replace(/ /g, "%20");
        // Browser: navigate into the machine. VST shell uses openMachine via embedded kShell.
        window.location.href = url;
      };
      grid.appendChild(card);
    });
  }

  document.getElementById("find").addEventListener("input", function (e) {
    query = e.target.value || "";
    render();
  });
  document.getElementById("filters").addEventListener("click", function (e) {
    const btn = e.target.closest("button[data-filter]");
    if (!btn) return;
    filter = btn.getAttribute("data-filter") || "all";
    Array.prototype.forEach.call(document.querySelectorAll("#filters button"), function (b) {
      b.classList.toggle("on", b === btn);
    });
    render();
  });

  // Login against the same worker the VST uses
  document.getElementById("loginForm").onsubmit = async function (e) {
    e.preventDefault();
    const err = document.getElementById("err");
    err.textContent = "";
    const user = document.getElementById("user").value.trim();
    const pass = document.getElementById("pass").value;
    if (!user || !pass) { err.textContent = "user + pass required"; return; }
    try {
      const res = await fetch(API, {
        method: "POST",
        headers: { "content-type": "application/json" },
        body: JSON.stringify({ action: "login", user: user, pass: pass })
      });
      const data = await res.json();
      if (!data.ok) { err.textContent = data.error || "login failed"; return; }
      localStorage.setItem("dreamdaw.token", data.token);
      localStorage.setItem("dreamdaw.user", data.user || user);
      document.getElementById("who").textContent = (data.user || user) + " · " + (data.role || "user");
      document.getElementById("status").textContent = "Signed in · session ready for Share / Lite / DREAMDAW";
    } catch (ex) {
      err.textContent = String(ex);
    }
  };
  const saved = localStorage.getItem("dreamdaw.user");
  if (saved) document.getElementById("who").textContent = saved;

  // VST downloads (Master / Share only — no Insomnia)
  (function () {
    var master = document.getElementById("vstMasterBtn");
    var share = document.getElementById("vstShareBtn");
    var go = document.getElementById("vstDownloadGo");
    var status = document.getElementById("vstDownloadStatus");
    var selected = "Share";
    var masterUrl = "DownloadVSTFile/One/Master.zip";
    var shareUrl = "DownloadVSTFile/Two/DreamShareVst.zip";
    function update(name) {
      selected = name;
      master.classList.toggle("on", name === "Master");
      share.classList.toggle("on", name === "Share");
      go.textContent = name === "Master" ? "Download Master VST" : "Download Share VST";
      status.textContent = name === "Master" ? "Master VST package." : "DreamShare VST3 package.";
    }
    master.addEventListener("click", function () { update("Master"); });
    share.addEventListener("click", function () { update("Share"); });
    go.addEventListener("click", function () {
      var a = document.createElement("a");
      a.href = selected === "Master" ? masterUrl : shareUrl;
      a.download = "";
      document.body.appendChild(a);
      a.click();
      a.remove();
    });
  })();

  fetch("library.json")
    .then(function (r) { return r.json(); })
    .then(function (lib) {
      allPlugins = lib.plugins || lib.machines || [];
      // Safety: never list Insomnia
      allPlugins = allPlugins.filter(function (p) {
        return String(p.name || "").toUpperCase().indexOf("INSOM") < 0;
      });
      document.getElementById("status").textContent =
        allPlugins.length + " machines · TRIPPAH base · plugin selector only";
      render();
    })
    .catch(function (e) {
      document.getElementById("grid").innerHTML =
        '<div class="empty">Could not load library.json<br>' + String(e) + "</div>";
    });
})();
  </script>
</body>
</html>
